components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AgentId:
      name: agentId
      in: query
      required: true
      description: Target enabled local Agentic agent id.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with an existing Room skill or idempotency key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid or missing GPT Actions API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Agent or session was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GatewayTimeout:
      description: Hub timed out waiting for the local agent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Hub could not deliver the proxied request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RoomAgentError:
      description: Room Hub-generated or Agent business error. An online Agent error may include the compact events panel; no-target, offline, and timeout errors omit it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoomAgentErrorResponse"
    AgentError:
      description: Agent returned an error for a targeted online operation. The compact events panel is optional and is absent when the Hub or Agent could not retrieve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentErrorResponse"
    InternalError:
      description: Hub internal error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    TmuxSession:
      type: object
      required:
        - session
        - windows
        - attached
        - createdEpoch
        - activityEpoch
      additionalProperties: false
      properties:
        session:
          type: string
        windows:
          type:
            - integer
            - "null"
        attached:
          type: boolean
        createdEpoch:
          type:
            - integer
            - "null"
        activityEpoch:
          type:
            - integer
            - "null"
    TmuxPane:
      type: object
      required:
        - session
        - windowIndex
        - paneIndex
        - paneId
        - currentPath
        - currentCommand
