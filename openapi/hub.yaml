openapi: 3.1.0
info:
  title: Agentic GPT Hub API
  version: 0.2.0
servers:
  - url: https://agentic-gpt.example.com
security:
  - bearerAuth: []
paths:
  /v1/info:
    get:
      operationId: getInfo
      x-openai-isConsequential: false
      responses:
        "200":
          description: Safe Hub runtime information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/agents:
    get:
      operationId: listAgents
      x-openai-isConsequential: false
      responses:
        "200":
          description: Enabled agents with safe configuration summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/exec:
    post:
      operationId: exec
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: Synchronous short command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/batchExec:
    post:
      operationId: batchExec
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchExecRequest"
      responses:
        "200":
          description: Synchronous batch command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchExecResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions/start:
    post:
      operationId: startSession
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: Started session id and current session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions:
    get:
      operationId: listSessions
      x-openai-isConsequential: false
      parameters:
        - name: agentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Running or waiting sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions/{sessionId}:
    get:
      operationId: inspectSession
      x-openai-isConsequential: false
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session state and recent output.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions/{sessionId}/wait:
    post:
      operationId: waitSession
      x-openai-isConsequential: false
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds:
                  type: integer
                  maximum: 30
                  minimum: 0
      responses:
        "200":
          description: Session state after waiting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions/{sessionId}/kill:
    post:
      operationId: killSession
      x-openai-isConsequential: false
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Killed session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/mcp/servers:
    post:
      operationId: mcpListServers
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpListServersRequest"
      responses:
        "200":
          description: Configured MCP servers on the selected local agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpListServersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/tools:
    post:
      operationId: mcpListTools
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpListToolsRequest"
      responses:
        "200":
          description: Tools exposed by a configured MCP server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpListToolsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/callTool:
    post:
      operationId: mcpCallTool
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpCallToolRequest"
      responses:
        "200":
          description: Result returned by the MCP tool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpCallToolResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/append:
    post:
      operationId: roomNotebookAppend
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookAppendRequest"
      responses:
        "200":
          description: Appended room notebook passage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookAppendResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/recent:
    post:
      operationId: roomNotebookRecent
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookRecentRequest"
      responses:
        "200":
          description: Recent room notebook passages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookPassagesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/selectExact:
    post:
      operationId: roomNotebookSelectExact
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookSelectExactRequest"
      responses:
        "200":
          description: Room notebook passages for one room-timezone calendar day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookPassagesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/search:
    post:
      operationId: roomNotebookSearch
      x-openai-isConsequential: false
      description: Simple bounded JSONL scan for small notebook datasets. No vector search or index is used in V1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookSearchRequest"
      responses:
        "200":
          description: Matching room notebook passages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookPassagesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/current:
    post:
      operationId: roomNotebookCurrent
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookCurrentRequest"
      responses:
        "200":
          description: Current recoverable state for a room notebook scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookCurrentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid or missing GPT Actions API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Agent or session was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GatewayTimeout:
      description: Hub timed out waiting for the local agent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Hub internal error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HubInfoResponse:
      type: object
      required:
        - service
        - version
        - publicBaseUrl
        - requestTimeoutSeconds
        - maxWaitSeconds
        - remoteConfirmation
        - agents
        - counts
        - generatedAt
      additionalProperties: false
      properties:
        service:
          type: string
        version:
          type: string
        publicBaseUrl:
          type:
            - string
            - "null"
        requestTimeoutSeconds:
          type: integer
        maxWaitSeconds:
          type: integer
        remoteConfirmation:
          type: object
          required: [enabled, provider, timeoutSeconds, ntfyConfigured]
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            provider:
              type: string
            timeoutSeconds:
              type: integer
            ntfyConfigured:
              type: boolean
        agents:
          type: object
          required: [registeredCount, enabledCount, onlineCount]
          additionalProperties: false
          properties:
            registeredCount:
              type: integer
            enabledCount:
              type: integer
            onlineCount:
              type: integer
        counts:
          type: object
          required: [pendingRequestCount, pendingConfirmationCount, cachedSessionCount]
          additionalProperties: false
          properties:
            pendingRequestCount:
              type: integer
            pendingConfirmationCount:
              type: integer
            cachedSessionCount:
              type: integer
        generatedAt:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
    ListAgentsResponse:
      type: object
      required: [agents]
      additionalProperties: false
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummary"
    AgentSummary:
      type: object
      required: [agentId, displayName, online, lastSeenAt, capabilities, configSummary]
      additionalProperties: false
      properties:
        agentId:
          type: string
        displayName:
          type: string
        online:
          type: boolean
        lastSeenAt:
          type:
            - string
            - "null"
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        configSummary:
          $ref: "#/components/schemas/SafeConfigSummary"
    Capabilities:
      type: object
      required: [sessions, confirmation, notificationActions]
      additionalProperties: false
      properties:
        sessions:
          type: boolean
        confirmation:
          type: boolean
        notificationActions:
          type: boolean
    SafeConfigSummary:
      type: object
      required: [workspaceRoot, sandbox, pathPolicy, policyRuleCounts, policyRules, confirmationProvider]
      additionalProperties: false
      properties:
        workspaceRoot:
          type: string
        sandbox:
          type: object
          required: [enabled, mode]
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            mode:
              type: string
        pathPolicy:
          type: object
          required: [writeRootCount, readOnlyRootCount, denyRootCount, writeRoots, readOnlyRoots, denyRoots]
          additionalProperties: false
          properties:
            writeRootCount:
              type: integer
            readOnlyRootCount:
              type: integer
            denyRootCount:
              type: integer
            writeRoots:
              type: array
              items:
                $ref: "#/components/schemas/SafePathRoot"
            readOnlyRoots:
              type: array
              items:
                $ref: "#/components/schemas/SafePathRoot"
            denyRoots:
              type: array
              items:
                $ref: "#/components/schemas/SafePathRoot"
        policyRuleCounts:
          type: object
          required: [allow, confirm, deny]
          additionalProperties: false
          properties:
            allow:
              type: integer
            confirm:
              type: integer
            deny:
              type: integer
        policyRules:
          $ref: "#/components/schemas/SafePolicyRules"
        confirmationProvider:
          type: string
    SafePathRoot:
      type: object
      required: [path, source]
      additionalProperties: false
      properties:
        path:
          type: string
        source:
          type: string
          enum: [configured, workspaceRoot]
    SafeRule:
      type: object
      required: [program, argsPrefix]
      additionalProperties: false
      properties:
        program:
          type: string
        argsPrefix:
          type: array
          items:
            type: string
    SafePolicyRules:
      type: object
      required: [allow, confirm, deny, builtins]
      additionalProperties: false
      properties:
        allow:
          type: array
          items:
            $ref: "#/components/schemas/SafeRule"
        confirm:
          type: array
          items:
            $ref: "#/components/schemas/SafeRule"
        deny:
          type: array
          items:
            $ref: "#/components/schemas/SafeRule"
        builtins:
          type: object
          required: [confirm, deny]
          additionalProperties: false
          properties:
            confirm:
              type: array
              items:
                $ref: "#/components/schemas/SafeRule"
            deny:
              type: array
              items:
                $ref: "#/components/schemas/SafeRule"
    McpListServersRequest:
      type: object
      required: [agentId]
      additionalProperties: false
      properties:
        agentId:
          type: string
    McpServerSummary:
      type: object
      required: [id, enabled, transport]
      additionalProperties: false
      properties:
        id:
          type: string
        enabled:
          type: boolean
        transport:
          type: string
        url:
          type:
            - string
            - "null"
    McpListServersResponse:
      type: object
      required: [servers]
      additionalProperties: false
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/McpServerSummary"
    McpListToolsRequest:
      type: object
      required: [agentId, serverId]
      additionalProperties: false
      properties:
        agentId:
          type: string
        serverId:
          type: string
    McpCallToolRequest:
      type: object
      required: [agentId, serverId, toolName, arguments]
      additionalProperties: false
      properties:
        agentId:
          type: string
        serverId:
          type: string
        toolName:
          type: string
        arguments:
          type: object
          additionalProperties: true
          properties: {}
    McpListToolsResponse:
      type: object
      required: [tools]
      additionalProperties: false
      properties:
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              name:
                type: string
              description:
                type: string
              inputSchema:
                type: object
                additionalProperties: true
                properties: {}
    McpCallToolResponse:
      type: object
      additionalProperties: true
      properties:
        content:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              type:
                type: string
              text:
                type: string
        structuredContent:
          type: object
          additionalProperties: true
          properties: {}
        isError:
          type: boolean
    PassageSignificance:
      type: string
      enum: [NORMAL, ANCHOR]
    NotebookAppendRequest:
      type: object
      required: [scope, significance, abstract, content]
      additionalProperties: false
      properties:
        datetime:
          type: string
          description: Optional ISO-8601 datetime. Stored as UTC; file partitioning uses configured room timezone.
        scope:
          type: string
          pattern: "^[A-Za-z0-9_.-]+$"
          description: Path-safe scope. Must not contain '..'.
        significance:
          $ref: "#/components/schemas/PassageSignificance"
        abstract:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
    NotebookAppendResponse:
      type: object
      required: [id, path, created, warnings]
      additionalProperties: false
      properties:
        id:
          type: string
        path:
          type: string
        created:
          type: boolean
        warnings:
          type: array
          items:
            type: string
    NotebookRecentRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          pattern: "^[A-Za-z0-9_.-]+$"
        days:
          type: integer
          minimum: 1
          maximum: 30
          default: 5
        significance:
          $ref: "#/components/schemas/PassageSignificance"
        limit:
          type: integer
          minimum: 1
          maximum: 100
    NotebookSelectExactRequest:
      type: object
      required: [year, month, day]
      additionalProperties: false
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
        scope:
          type: string
          pattern: "^[A-Za-z0-9_.-]+$"
        limit:
          type: integer
          minimum: 1
          maximum: 100
    NotebookSearchRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query:
          type: string
        scope:
          type: string
          pattern: "^[A-Za-z0-9_.-]+$"
        limit:
          type: integer
          minimum: 1
          maximum: 100
    NotebookCurrentRequest:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope:
          type: string
          pattern: "^[A-Za-z0-9_.-]+$"
    NotebookPassagePreview:
      type: object
      required: [id, datetime, scope, significance, abstract, contentPreview, tags, displayMode, truncated]
      additionalProperties: false
      properties:
        id:
          type: string
        datetime:
          type: string
        scope:
          type: string
        significance:
          $ref: "#/components/schemas/PassageSignificance"
        abstract:
          type: string
        contentPreview:
          type: string
        tags:
          type: array
          items:
            type: string
        displayMode:
          type: string
          enum: [full, anchor, abstract, search]
        truncated:
          type: boolean
    NotebookPassagesResponse:
      type: object
      required: [passages, warnings]
      additionalProperties: false
      properties:
        passages:
          type: array
          items:
            $ref: "#/components/schemas/NotebookPassagePreview"
        warnings:
          type: array
          items:
            type: string
    NotebookCurrent:
      type: object
      required: [scope, updatedAt, sourcePassageId, abstract, content, tags]
      additionalProperties: false
      properties:
        scope:
          type: string
        updatedAt:
          type: string
        sourcePassageId:
          type: string
        abstract:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
    NotebookCurrentResponse:
      type: object
      required: [current, warnings]
      additionalProperties: false
      properties:
        current:
          anyOf:
            - $ref: "#/components/schemas/NotebookCurrent"
            - type: "null"
        warnings:
          type: array
          items:
            type: string
    ExecRequest:
      type: object
      required: [agentId, program, args, needConfirm]
      additionalProperties: false
      properties:
        agentId:
          type: string
        program:
          type: string
        args:
          type: array
          items:
            type: string
        needConfirm:
          type: boolean
        confirmMethod:
          type: string
          enum: [default, freedesktop, hub, freedesktop-then-hub, freedesktopThenHub]
          description: Optional per-request confirmation provider override. Omit or use default to follow the local agent configuration.
        workingDirectory:
          type: string
          description: Optional command working directory. Relative values are resolved from the agent workspace root. The resolved directory must exist and be inside writable roots, not denied roots.
    TaskResult:
      type: object
      required: [agentId, taskId, status, exitCode, stdoutTail, stderrTail, truncated, startedAt, updatedAt]
      additionalProperties: true
      properties:
        agentId:
          type: string
        taskId:
          type: string
        status:
          type: string
        exitCode:
          type:
            - integer
            - "null"
        stdoutTail:
          type: string
        stderrTail:
          type: string
        truncated:
          type: boolean
        rejectReason:
          type: string
        startedAt:
          type: string
        updatedAt:
          type: string
    BatchExecRequest:
      type: object
      required: [agentId, elements, needConfirm]
      additionalProperties: false
      properties:
        agentId:
          type: string
        elements:
          type: array
          minItems: 1
          items:
            type: object
            required: [program, args]
            additionalProperties: false
            properties:
              program:
                type: string
              args:
                type: array
                items:
                  type: string
              workingDirectory:
                type: string
                description: Optional per-element working directory. Overrides the batch workingDirectory for this element.
        needConfirm:
          type: boolean
        confirmMethod:
          type: string
          enum: [default, freedesktop, hub, freedesktop-then-hub, freedesktopThenHub]
          description: Optional per-request confirmation provider override for all batch elements. Omit or use default to follow the local agent configuration.
        workingDirectory:
          type: string
          description: Optional default working directory for all batch elements. Relative values are resolved from the agent workspace root. Per-element workingDirectory values override this.
    BatchExecResult:
      type: object
      required: [agentId, batchId, status, results, startedAt, updatedAt]
      additionalProperties: true
      properties:
        agentId:
          type: string
        batchId:
          type: string
        status:
          type: string
        results:
          type: array
          items:
            type: object
            required: [index, program, args, result]
            additionalProperties: false
            properties:
              index:
                type: integer
              program:
                type: string
              args:
                type: array
                items:
                  type: string
              workingDirectory:
                type: string
              result:
                $ref: "#/components/schemas/TaskResult"
        startedAt:
          type: string
        updatedAt:
          type: string
    StartSessionResponse:
      type: object
      required: [status, sessionId, session]
      additionalProperties: false
      properties:
        status:
          type: string
        sessionId:
          type: string
        session:
          $ref: "#/components/schemas/SessionInfo"
    ListSessionsResponse:
      type: object
      required: [sessions]
      additionalProperties: false
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
    SessionInfo:
      type: object
      required: [agentId, sessionId, state, program, args, commandPreview, startedAt, updatedAt, exitCode, stdoutTail, stderrTail, truncated]
      additionalProperties: true
      properties:
        agentId:
          type: string
        sessionId:
          type: string
        state:
          type: string
        program:
          type: string
        args:
          type: array
          items:
            type: string
        workingDirectory:
          type: string
        commandPreview:
          type: string
        startedAt:
          type: string
        updatedAt:
          type: string
        exitCode:
          type:
            - integer
            - "null"
        stdoutTail:
          type: string
        stderrTail:
          type: string
        truncated:
          type: boolean
        rejectReason:
          type: string
