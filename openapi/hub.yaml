openapi: 3.1.0
info:
  title: Agentic GPT Hub API
  version: 0.2.0
servers:
  - url: https://agentic-gpt.example.com
security:
  - bearerAuth: []
paths:
  /v1/agents:
    get:
      operationId: listAgents
      x-openai-isConsequential: false
      responses:
        "200":
          description: Enabled agents with safe configuration summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/exec:
    post:
      operationId: exec
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: Synchronous short command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/batchExec:
    post:
      operationId: batchExec
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchExecRequest"
      responses:
        "200":
          description: Synchronous batch command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchExecResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions/start:
    post:
      operationId: startSession
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: Started session id and current session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions:
    get:
      operationId: listSessions
      x-openai-isConsequential: false
      parameters:
        - name: agentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Running or waiting sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions/{sessionId}:
    get:
      operationId: inspectSession
      x-openai-isConsequential: false
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session state and recent output.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions/{sessionId}/wait:
    post:
      operationId: waitSession
      x-openai-isConsequential: false
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds:
                  type: integer
                  maximum: 30
                  minimum: 0
      responses:
        "200":
          description: Session state after waiting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions/{sessionId}/kill:
    post:
      operationId: killSession
      x-openai-isConsequential: false
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Killed session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/mcp/servers:
    post:
      operationId: mcpListServers
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpListServersRequest"
      responses:
        "200":
          description: Configured MCP servers on the selected local agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpListServersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/tools:
    post:
      operationId: mcpListTools
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpListToolsRequest"
      responses:
        "200":
          description: Tools exposed by a configured MCP server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpListToolsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/callTool:
    post:
      operationId: mcpCallTool
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpCallToolRequest"
      responses:
        "200":
          description: Result returned by the MCP tool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpCallToolResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid or missing GPT Actions API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Agent or session was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GatewayTimeout:
      description: Hub timed out waiting for the local agent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Hub internal error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
    ListAgentsResponse:
      type: object
      required: [agents]
      additionalProperties: false
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummary"
    AgentSummary:
      type: object
      required: [agentId, displayName, online, lastSeenAt, capabilities, configSummary]
      additionalProperties: false
      properties:
        agentId:
          type: string
        displayName:
          type: string
        online:
          type: boolean
        lastSeenAt:
          type:
            - string
            - "null"
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        configSummary:
          $ref: "#/components/schemas/SafeConfigSummary"
    Capabilities:
      type: object
      required: [sessions, confirmation, notificationActions]
      additionalProperties: false
      properties:
        sessions:
          type: boolean
        confirmation:
          type: boolean
        notificationActions:
          type: boolean
    SafeConfigSummary:
      type: object
      required: [workspaceRoot, sandbox, policyRuleCounts, confirmationProvider]
      additionalProperties: false
      properties:
        workspaceRoot:
          type: string
        sandbox:
          type: object
          required: [enabled, mode]
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            mode:
              type: string
        policyRuleCounts:
          type: object
          required: [allow, confirm, deny]
          additionalProperties: false
          properties:
            allow:
              type: integer
            confirm:
              type: integer
            deny:
              type: integer
        confirmationProvider:
          type: string
    McpListServersRequest:
      type: object
      required: [agentId]
      additionalProperties: false
      properties:
        agentId:
          type: string
    McpServerSummary:
      type: object
      required: [id, enabled, transport]
      additionalProperties: false
      properties:
        id:
          type: string
        enabled:
          type: boolean
        transport:
          type: string
        url:
          type:
            - string
            - "null"
    McpListServersResponse:
      type: object
      required: [servers]
      additionalProperties: false
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/McpServerSummary"
    McpListToolsRequest:
      type: object
      required: [agentId, serverId]
      additionalProperties: false
      properties:
        agentId:
          type: string
        serverId:
          type: string
    McpCallToolRequest:
      type: object
      required: [agentId, serverId, toolName, arguments]
      additionalProperties: false
      properties:
        agentId:
          type: string
        serverId:
          type: string
        toolName:
          type: string
        arguments:
          type: object
          additionalProperties: true
          properties: {}
    McpListToolsResponse:
      type: object
      required: [tools]
      additionalProperties: false
      properties:
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              name:
                type: string
              description:
                type: string
              inputSchema:
                type: object
                additionalProperties: true
                properties: {}
    McpCallToolResponse:
      type: object
      additionalProperties: true
      properties:
        content:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              type:
                type: string
              text:
                type: string
        structuredContent:
          type: object
          additionalProperties: true
          properties: {}
        isError:
          type: boolean
    ExecRequest:
      type: object
      required: [agentId, program, args, needConfirm]
      additionalProperties: false
      properties:
        agentId:
          type: string
        program:
          type: string
        args:
          type: array
          items:
            type: string
        needConfirm:
          type: boolean
        confirmMethod:
          type: string
          enum: [default, freedesktop, hub, freedesktop-then-hub, freedesktopThenHub]
          description: Optional per-request confirmation provider override. Omit or use default to follow the local agent configuration.
    TaskResult:
      type: object
      required: [agentId, taskId, status, exitCode, stdoutTail, stderrTail, truncated, startedAt, updatedAt]
      additionalProperties: true
      properties:
        agentId:
          type: string
        taskId:
          type: string
        status:
          type: string
        exitCode:
          type:
            - integer
            - "null"
        stdoutTail:
          type: string
        stderrTail:
          type: string
        truncated:
          type: boolean
        rejectReason:
          type: string
        startedAt:
          type: string
        updatedAt:
          type: string
    BatchExecRequest:
      type: object
      required: [agentId, elements, needConfirm]
      additionalProperties: false
      properties:
        agentId:
          type: string
        elements:
          type: array
          minItems: 1
          items:
            type: object
            required: [program, args]
            additionalProperties: false
            properties:
              program:
                type: string
              args:
                type: array
                items:
                  type: string
        needConfirm:
          type: boolean
        confirmMethod:
          type: string
          enum: [default, freedesktop, hub, freedesktop-then-hub, freedesktopThenHub]
          description: Optional per-request confirmation provider override for all batch elements. Omit or use default to follow the local agent configuration.
    BatchExecResult:
      type: object
      required: [agentId, batchId, status, results, startedAt, updatedAt]
      additionalProperties: true
      properties:
        agentId:
          type: string
        batchId:
          type: string
        status:
          type: string
        results:
          type: array
          items:
            type: object
            required: [index, program, args, result]
            additionalProperties: false
            properties:
              index:
                type: integer
              program:
                type: string
              args:
                type: array
                items:
                  type: string
              result:
                $ref: "#/components/schemas/TaskResult"
        startedAt:
          type: string
        updatedAt:
          type: string
    StartSessionResponse:
      type: object
      required: [status, sessionId, session]
      additionalProperties: false
      properties:
        status:
          type: string
        sessionId:
          type: string
        session:
          $ref: "#/components/schemas/SessionInfo"
    ListSessionsResponse:
      type: object
      required: [sessions]
      additionalProperties: false
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
    SessionInfo:
      type: object
      required: [agentId, sessionId, state, program, args, commandPreview, startedAt, updatedAt, exitCode, stdoutTail, stderrTail, truncated]
      additionalProperties: true
      properties:
        agentId:
          type: string
        sessionId:
          type: string
        state:
          type: string
        program:
          type: string
        args:
          type: array
          items:
            type: string
        commandPreview:
          type: string
        startedAt:
          type: string
        updatedAt:
          type: string
        exitCode:
          type:
            - integer
            - "null"
        stdoutTail:
          type: string
        stderrTail:
          type: string
        truncated:
          type: boolean
        rejectReason:
          type: string
