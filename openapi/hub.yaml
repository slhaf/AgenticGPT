openapi: 3.1.0
info:
  title: Agentic GPT Hub API
  version: 0.3.1
servers:
  - url: https://agentic-gpt.example.com
security:
  - bearerAuth: []
paths:
  /v1/info:
    get:
      operationId: getInfo
      description: Return Hub runtime metadata, public base URL, remote confirmation status, and safe aggregate counts.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Safe Hub runtime information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/agents:
    get:
      operationId: listAgents
      description: List registered local agents, online status, capabilities, and safe config summaries. Use this before choosing an agentId.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Enabled agents with safe configuration summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/process/exec:
    post:
      operationId: processExec
      description: Start one managed process and wait briefly. The response is always a Job envelope; use getJob for later state/output and cancelJob for cancellation evidence.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: Managed process Job envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/process/batch:
    post:
      operationId: processBatch
      description: Atomically admit multiple managed processes with one confirmation decision. Returns ordered child Jobs; use getJob and cancelJob for lifecycle control.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchExecRequest"
      responses:
        "200":
          description: Managed process batch Job envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/jobs:
    get:
      operationId: listJobs
      description: List active or recently retained Jobs for one local Agentic agent with optional kind/state filters.
      x-openai-isConsequential: false
      parameters:
        - name: agentId
          in: query
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobKind"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobState"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Active or recently retained Jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/jobs/{jobId}:
    get:
      operationId: getJob
      description: Inspect or briefly wait for one Job. waitSeconds is capped at 30; cached state is used if the Agent is temporarily unavailable.
      x-openai-isConsequential: false
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
        - name: waitSeconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 30
            default: 0
      responses:
        "200":
          description: Current Job state and bounded output.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      description: Request kind-aware cancellation for one Job and return cancellation outcome and termination evidence.
      x-openai-isConsequential: true
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job state after the cancellation request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tmux/sessions:
    get:
      operationId: tmuxListSessions
      description: List persistent tmux shared workspaces. Start tmux workflows here, then use tmuxListPanes to locate the relevant pane.
      x-openai-isConsequential: false
      parameters:
        - name: agentId
          in: query
          required: true
          description: Target enabled local Agentic agent id.
          schema:
            type: string
      responses:
        "200":
          description: tmux sessions or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxListSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/panes:
    get:
      operationId: tmuxListPanes
      description: List tmux panes and their cwd, foreground command, process/mode state, and isLikelyShell. Use tmuxExec for shell panes and tmuxPasteText for non-shell panes.
      x-openai-isConsequential: false
      parameters:
        - name: agentId
          in: query
          required: true
          description: Target enabled local Agentic agent id.
          schema:
            type: string
        - name: session
          in: query
          required: false
          description: Optional tmux session name to scope pane listing.
          schema:
            type: string
      responses:
        "200":
          description: Matching tmux panes or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxListPanesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/capture:
    post:
      operationId: tmuxCapturePane
      description: Capture recent pane history before acting or to observe progress after tmuxExec. This is read-only.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxCaptureRequest"
      responses:
        "200":
          description: Pane capture or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxCaptureResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/exec:
    post:
      operationId: tmuxExec
      description: Submit one structured program and argument vector atomically to a tmux shell pane. Pane cwd, command policy, path policy, confirmation, and audit apply. Returns a bounded post-submit pane snapshot after waitMs. Submission does not prove completion; use exec when an exit status is required.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxExecRequest"
      responses:
        "200":
          description: Submission result or a structured policy/agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/paste:
    post:
      operationId: tmuxPasteText
      description: Paste text into a non-shell tmux pane or TUI. Shell panes are rejected and must use tmuxExec. Confirmation defaults to true.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxPasteRequest"
      responses:
        "200":
          description: Paste result or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/sessions/create:
    post:
      operationId: tmuxCreateSession
      description: Create an idempotent persistent tmux workspace when no suitable session exists. Prefer reusing the default agentic session. cwd is checked by local path policy.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxCreateSessionRequest"
      responses:
        "200":
          description: Session creation result or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/sessions/close:
    post:
      operationId: tmuxCloseSession
      description: Close a persistent tmux workspace only when explicitly no longer needed. Confirmation defaults to true.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxCloseSessionRequest"
      responses:
        "200":
          description: Session close result or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/servers:
    post:
      operationId: mcpListServers
      description: List MCP servers configured inside one local Agentic agent, or all currently connected agents when agentId is omitted.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpListServersRequest"
      responses:
        "200":
          description: Configured MCP servers on the selected local agent, or grouped by connected agent when agentId is omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpListServersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/tools:
    post:
      operationId: mcpListTools
      description: List tools exposed by one MCP server configured inside a local Agentic agent.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpListToolsRequest"
      responses:
        "200":
          description: Tools exposed by a configured MCP server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpListToolsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/callTool:
    post:
      operationId: mcpCallTool
      description: Start a managed downstream MCP tool Job through a local Agentic agent. Returns a bounded JobResponse; use job.get/job.cancel for later result or cancellation evidence.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpCallToolRequest"
      responses:
        "200":
          description: Managed MCP Job envelope after the bounded inline wait.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/notify/channels:
    get:
      operationId: userNotifyChannels
      description: List Hub-native user notification channels. This does not use the active Room Agent.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Available and unavailable notification channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotifyChannelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/notify/send:
    post:
      operationId: userNotifySend
      description: Send a Hub-native notification to the user through a selected channel. This does not use the active Room Agent.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserNotifySendRequest"
      responses:
        "200":
          description: Notification send result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotifySendResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/room/notebook/append:
    post:
      operationId: roomNotebookAppend
      description: Append an explicit notebook passage to the active Room Agent. ANCHOR passages update current state for their scope. No agentId is used.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookAppendRequest"
      responses:
        "200":
          description: Appended room notebook passage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookAppendResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/recent:
    post:
      operationId: roomNotebookRecent
      description: Return recent notebook passages from the active Room Agent, with optional scope and significance filters. No agentId is used.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookRecentRequest"
      responses:
        "200":
          description: Recent room notebook passages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookPassagesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/selectExact:
    post:
      operationId: roomNotebookSelectExact
      description: Return notebook passages for one exact room-timezone calendar day from the active Room Agent. No agentId is used.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookSelectExactRequest"
      responses:
        "200":
          description: Room notebook passages for one room-timezone calendar day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookPassagesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/search:
    post:
      operationId: roomNotebookSearch
      description: Search notebook passages in the active Room Agent by simple substring scan over abstract, content, scope, and tags. No vector search is used in V1.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookSearchRequest"
      responses:
        "200":
          description: Matching room notebook passages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookPassagesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/current:
    post:
      operationId: roomNotebookCurrent
      description: Return current recoverable notebook state for one scope, derived from current state or the latest ANCHOR. No agentId is used.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookCurrentRequest"
      responses:
        "200":
          description: Current recoverable state for a room notebook scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookCurrentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/update:
    post:
      operationId: roomNotebookUpdate
      description: Update editable fields of one notebook passage in the active Room Agent. Scope and datetime are immutable; current state is refreshed when anchors change.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookUpdateRequest"
      responses:
        "200":
          description: Updated room notebook passage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookUpdateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/remove:
    post:
      operationId: roomNotebookRemove
      description: Remove one notebook passage from the active Room Agent storage. If it was current, current state falls back to the latest ANCHOR or becomes null.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookRemoveRequest"
      responses:
        "200":
          description: Removed room notebook passage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookRemoveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/bootstrap:
    post:
      operationId: roomBootstrap
      description: Load the repeated session bootstrap entrypoint and deterministic guide manifest from the active Room Agent workspace. No agentId or request body is used.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Room bootstrap entrypoint and guide manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/bootstrap/read:
    post:
      operationId: roomBootstrapRead
      description: Read one valid bootstrap guide by id from the active Room Agent workspace, including typed metadata, raw frontmatter, and bounded Markdown content. No agentId is used.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapReadRequest"
      responses:
        "200":
          description: One Room bootstrap guide and bounded resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapReadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/skills/list:
    post:
      operationId: roomSkillsList
      description: List valid skills in the active Room Agent workspace. Scans workspace skills/*/SKILL.md and marks active skills. No agentId is used.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Valid workspace skills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/skills/read:
    post:
      operationId: roomSkillsRead
      description: Read one skill package from the active Room Agent workspace by id, including SKILL.md, parsed frontmatter, package summary, warnings, and active status. No agentId is used.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillReadRequest"
      responses:
        "200":
          description: Skill detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillReadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/skills/search:
    post:
      operationId: roomSkillsSearch
      description: Search skills in the active Room Agent workspace by case-insensitive substring over id, frontmatter, tags, and SKILL.md content. No agentId is used.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillSearchRequest"
      responses:
        "200":
          description: Matching workspace skills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsSearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/skills/active:
    post:
      operationId: roomSkillsActive
      description: Return active skills for the active Room Agent workspace. Deleted skills remain listed as stale/missing until deactivated. No agentId is used.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Active workspace skills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsActiveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/skills/activate:
    post:
      operationId: roomSkillsActivate
      description: Mark an existing valid skill as active in the active Room Agent workspace. This grants no permissions and executes nothing. No agentId is used.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillActivationRequest"
      responses:
        "200":
          description: Skill activation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillActivationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/skills/deactivate:
    post:
      operationId: roomSkillsDeactivate
      description: Remove active state for a skill id in the active Room Agent workspace. This succeeds even for stale/missing skills. No agentId is used.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillActivationRequest"
      responses:
        "200":
          description: Skill deactivation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillActivationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/skills/install:
    post:
      operationId: roomSkillsInstall
      description: Start an asynchronous installation of one Room skill from public GitHub, HTTPS files, or inline content. Returns an installId for bounded polling. No agentId is used.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInstallRequest"
      responses:
        "200":
          description: Installation accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillInstallStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/skills/install/get:
    post:
      operationId: roomSkillsInstallGet
      description: Return a Room skill installation status, optionally waiting up to 30 seconds for a newer revision. No agentId is used.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInstallGetRequest"
      responses:
        "200":
          description: Installation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillInstallStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/skills/install/cancel:
    post:
      operationId: roomSkillsInstallCancel
      description: Request idempotent cooperative cancellation of a Room skill installation. No agentId is used.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInstallCancelRequest"
      responses:
        "200":
          description: Cancellation outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillInstallCancelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/skills/run:
    post:
      operationId: roomSkillsRun
      description: Run an executable scripts/ file from an active workspace skill through the Room Agent ManagedJob engine. Fast terminal results are returned inline; otherwise use the returned jobId with getJob or cancelJob. No agentId is used.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillRunRequest"
      responses:
        "200":
          description: Skill run started or completed inline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/runs/{runId}:
    get:
      operationId: getRun
      description: Return persisted status and result for one Hub-to-Agent command run. Use this when a synchronous request timed out but returned a runId.
      x-openai-isConsequential: false
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Persisted run status and optional result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AgentId:
      name: agentId
      in: query
      required: true
      description: Target enabled local Agentic agent id.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with an existing Room skill or idempotency key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid or missing GPT Actions API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Agent or session was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GatewayTimeout:
      description: Hub timed out waiting for the local agent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Hub could not deliver the proxied request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Hub internal error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    TmuxSession:
      type: object
      required:
        - session
        - windows
        - attached
        - createdEpoch
        - activityEpoch
      additionalProperties: false
      properties:
        session:
          type: string
        windows:
          type:
            - integer
            - "null"
        attached:
          type: boolean
        createdEpoch:
          type:
            - integer
            - "null"
        activityEpoch:
          type:
            - integer
            - "null"
    TmuxPane:
      type: object
      required:
        - session
        - windowIndex
        - paneIndex
        - paneId
        - currentPath
        - currentCommand
        - width
        - height
        - panePid
        - paneInMode
        - paneDead
        - isLikelyShell
      additionalProperties: false
      properties:
        session:
          type: string
        windowIndex:
          type:
            - integer
            - "null"
        paneIndex:
          type:
            - integer
            - "null"
        paneId:
          type: string
        currentPath:
          type: string
        currentCommand:
          type: string
        width:
          type:
            - integer
            - "null"
        height:
          type:
            - integer
            - "null"
        panePid:
          type:
            - integer
            - "null"
        paneInMode:
          type: boolean
        paneDead:
          type: boolean
        isLikelyShell:
          type: boolean
    TmuxListSessionsResponse:
      type: object
      required:
        - sessions
      additionalProperties: true
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/TmuxSession"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    TmuxListPanesResponse:
      type: object
      required:
        - panes
      additionalProperties: true
      properties:
        session:
          type:
            - string
            - "null"
        panes:
          type: array
          items:
            $ref: "#/components/schemas/TmuxPane"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    TmuxCaptureRequest:
      type: object
      required:
        - agentId
        - target
      additionalProperties: false
      properties:
        agentId:
          type: string
        target:
          type: string
        lines:
          type: integer
          minimum: 1
          maximum: 5000
          default: 160
    TmuxCaptureResponse:
      type: object
      additionalProperties: true
      properties:
        target:
          type: string
        lines:
          type: integer
        capture:
          type: string
        error:
          $ref: "#/components/schemas/ErrorDetail"
    TmuxExecRequest:
      type: object
      required:
        - agentId
        - target
        - program
      additionalProperties: false
      properties:
        agentId:
          type: string
        target:
          type: string
        program:
          type: string
        args:
          type: array
          default: []
          items:
            type: string
        needConfirm:
          type: boolean
          default: false
          description: Force confirmation in addition to configured command policy.
        waitMs:
          type: integer
          minimum: 0
          maximum: 5000
          default: 300
          description: Milliseconds to wait before returning the post-submit pane snapshot.
        captureLines:
          type: integer
          minimum: 0
          maximum: 5000
          default: 120
          description: Number of tmux history lines included in the post-submit snapshot. Set to 0 to disable the snapshot.
    TmuxPasteRequest:
      type: object
      required:
        - agentId
        - target
        - text
      additionalProperties: false
      properties:
        agentId:
          type: string
        target:
          type: string
        text:
          type: string
        submit:
          type: boolean
          default: false
        needConfirm:
          type: boolean
          default: true
    TmuxCreateSessionRequest:
      type: object
      required:
        - agentId
        - name
        - cwd
      additionalProperties: false
      properties:
        agentId:
          type: string
        name:
          type: string
        cwd:
          type: string
          description: Existing session cwd. It must be inside writable roots and outside denied roots.
    TmuxCloseSessionRequest:
      type: object
      required:
        - agentId
        - name
      additionalProperties: false
      properties:
        agentId:
          type: string
        name:
          type: string
        needConfirm:
          type: boolean
          default: true
    TmuxOperationResponse:
      type: object
      additionalProperties: true
      properties:
        accepted:
          type: boolean
        waitMs:
          type: integer
        captureLines:
          type: integer
        snapshot:
          type: object
          additionalProperties: true
          properties:
            target:
              type: string
            waitMs:
              type: integer
            lines:
              type: integer
            capture:
              type: string
            error:
              $ref: "#/components/schemas/ErrorDetail"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
    HubInfoResponse:
      type: object
      required:
        - service
        - version
        - publicBaseUrl
        - requestTimeoutSeconds
        - maxWaitSeconds
        - remoteConfirmation
        - agents
        - counts
        - generatedAt
      additionalProperties: false
      properties:
        service:
          type: string
        version:
          type: string
        publicBaseUrl:
          type:
            - string
            - "null"
        requestTimeoutSeconds:
          type: integer
        maxWaitSeconds:
          type: integer
        remoteConfirmation:
          type: object
          required:
            - enabled
            - provider
            - timeoutSeconds
            - ntfyConfigured
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            provider:
              type: string
            timeoutSeconds:
              type: integer
            ntfyConfigured:
              type: boolean
        agents:
          type: object
          required:
            - registeredCount
            - enabledCount
            - onlineCount
          additionalProperties: false
          properties:
            registeredCount:
              type: integer
            enabledCount:
              type: integer
            onlineCount:
              type: integer
        counts:
          type: object
          required:
            - pendingRequestCount
            - pendingConfirmationCount
            - cachedJobCount
          additionalProperties: false
          properties:
            pendingRequestCount:
              type: integer
            pendingConfirmationCount:
              type: integer
            cachedJobCount:
              type: integer
        generatedAt:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
            - code
            - message
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
    AgentRun:
      type: object
      required:
        - runId
        - requestId
        - agentId
        - commandType
        - commandHash
        - status
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        runId:
          type: string
        requestId:
          type: string
        agentId:
          type: string
        commandType:
          type: string
        commandHash:
          type: string
        status:
          type: string
          enum:
            - created
            - dispatched
            - acked
            - started
            - running
            - completed
            - timeout_waiting_result
            - unknown
            - failed
        result:
          description: Completed command result, when available.
        reason:
          type:
            - string
            - "null"
        createdAt:
          type: string
        updatedAt:
          type: string
    ListAgentsResponse:
      type: object
      required:
        - agents
      additionalProperties: false
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummary"
    AgentSummary:
      type: object
      required:
        - agentId
        - displayName
        - online
        - transport
        - lastSeenAt
        - capabilities
        - configSummary
      additionalProperties: false
      properties:
        agentId:
          type: string
        alias:
          type:
            - string
            - "null"
        displayName:
          type: string
        online:
          type: boolean
        transport:
          type:
            - string
            - "null"
          enum:
            - websocket
            - sse
            - null
        lastSeenAt:
          type:
            - string
            - "null"
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        configSummary:
          $ref: "#/components/schemas/SafeConfigSummary"
    Capabilities:
      type: object
      required:
        - sessions
        - confirmation
        - notificationActions
      additionalProperties: false
      properties:
        sessions:
          type: boolean
        confirmation:
          type: boolean
        notificationActions:
          type: boolean
    SafeConfigSummary:
      type: object
      required:
        - workspaceRoot
        - sandbox
        - pathPolicy
        - policyRuleCounts
        - policyRules
        - confirmationProvider
      additionalProperties: false
      properties:
        workspaceRoot:
          type: string
        sandbox:
          type: object
          required:
            - enabled
            - mode
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            mode:
              type: string
        pathPolicy:
          type: object
          required:
            - writeRootCount
            - readOnlyRootCount
            - denyRootCount
            - writeRoots
            - readOnlyRoots
            - denyRoots
          additionalProperties: false
          properties:
            writeRootCount:
              type: integer
            readOnlyRootCount:
              type: integer
            denyRootCount:
              type: integer
            writeRoots:
              type: array
              items:
                $ref: "#/components/schemas/SafePathRoot"
            readOnlyRoots:
              type: array
              items:
                $ref: "#/components/schemas/SafePathRoot"
            denyRoots:
              type: array
              items:
                $ref: "#/components/schemas/SafePathRoot"
        policyRuleCounts:
          type: object
          required:
            - allow
            - confirm
            - deny
          additionalProperties: false
          properties:
            allow:
              type: integer
            confirm:
              type: integer
            deny:
              type: integer
        policyRules:
          $ref: "#/components/schemas/SafePolicyRules"
        confirmationProvider:
          type: string
    SafePathRoot:
      type: object
      required:
        - path
        - source
      additionalProperties: false
      properties:
        path:
          type: string
        source:
          type: string
          enum:
            - configured
            - workspaceRoot
    SafeRule:
      type: object
      required:
        - program
        - argsPrefix
      additionalProperties: false
      properties:
        program:
          type: string
        argsPrefix:
          type: array
          items:
            type: string
    SafePolicyRules:
      type: object
      required:
        - allow
        - confirm
        - deny
        - builtins
      additionalProperties: false
      properties:
        allow:
          type: array
          items:
            $ref: "#/components/schemas/SafeRule"
        confirm:
          type: array
          items:
            $ref: "#/components/schemas/SafeRule"
        deny:
          type: array
          items:
            $ref: "#/components/schemas/SafeRule"
        builtins:
          type: object
          required:
            - confirm
            - deny
          additionalProperties: false
          properties:
            confirm:
              type: array
              items:
                $ref: "#/components/schemas/SafeRule"
            deny:
              type: array
              items:
                $ref: "#/components/schemas/SafeRule"
    McpListServersRequest:
      type: object
      additionalProperties: false
      properties:
        agentId:
          type: string
          description: Optional target local agent id. Omit to list MCP servers for all currently connected agents.
    McpServerSummary:
      type: object
      required:
        - id
        - enabled
        - transport
      additionalProperties: false
      properties:
        id:
          type: string
        enabled:
          type: boolean
        transport:
          type: string
        url:
          type:
            - string
            - "null"
    McpListServersResponse:
      type: object
      additionalProperties: false
      properties:
        servers:
          type: array
          description: MCP servers on the selected agent when agentId is provided.
          items:
            $ref: "#/components/schemas/McpServerSummary"
        agents:
          type: array
          description: MCP servers grouped by connected agent when agentId is omitted.
          items:
            $ref: "#/components/schemas/McpAgentServersSummary"
    McpAgentServersSummary:
      type: object
      required:
        - agentId
        - displayName
        - online
        - servers
      additionalProperties: false
      properties:
        agentId:
          type: string
        displayName:
          type: string
        online:
          type: boolean
        servers:
          type: array
          items:
            $ref: "#/components/schemas/McpServerSummary"
        error:
          type: object
          additionalProperties: true
          description: Per-agent error if the Hub could not retrieve that agent's MCP servers.
    McpListToolsRequest:
      type: object
      required:
        - agentId
        - serverId
      additionalProperties: false
      properties:
        agentId:
          type: string
        serverId:
          type: string
    McpCallToolRequest:
      type: object
      required:
        - agentId
        - serverId
        - toolName
        - arguments
      additionalProperties: false
      properties:
        agentId:
          type: string
        serverId:
          type: string
        toolName:
          type: string
        arguments:
          type: object
          additionalProperties: true
          properties: {}
          description: Downstream tool arguments; maximum serialized size 256 KiB.
        waitSeconds:
          type: integer
          minimum: 0
          maximum: 30
          default: 5
          description: Bounded inline wait before returning the Job envelope.
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 900
          default: 300
          description: Absolute downstream execution deadline.
    McpListToolsResponse:
      type: object
      required:
        - tools
      additionalProperties: false
      properties:
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              name:
                type: string
              description:
                type: string
              inputSchema:
                type: object
                additionalProperties: true
                properties: {}
    UserNotifyChannelsResponse:
      type: object
      required:
        - channels
      additionalProperties: false
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/NotificationChannel"
    NotificationChannel:
      type: object
      required:
        - key
        - displayName
        - available
        - kind
        - supportsActions
      additionalProperties: false
      properties:
        key:
          type: string
          examples:
            - agent::laptop::freedesktop
            - hub::ntfy
            - hub::android::notice
        displayName:
          type: string
        available:
          type: boolean
        kind:
          type: string
          enum:
            - freedesktop
            - ntfy
            - android_notice
            - android_alarm
        supportsActions:
          type: boolean
        reason:
          type:
            - string
            - "null"
          examples:
            - android_endpoint_not_connected
            - android_delivery_not_implemented
        agentId:
          type:
            - string
            - "null"
    NotificationAction:
      type: object
      required:
        - id
        - label
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable action id. Android ack will report this as actionId.
        label:
          type: string
    UserNotifySendRequest:
      type: object
      required:
        - channel
        - title
        - body
      additionalProperties: false
      properties:
        channel:
          type: string
          description: Notification channel key returned by userNotifyChannels.
        title:
          type: string
        body:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/NotificationAction"
        priority:
          type: string
          enum:
            - min
            - low
            - normal
            - high
            - urgent
            - alarm
    UserNotifySendResponse:
      type: object
      required:
        - channelKey
        - accepted
      additionalProperties: false
      properties:
        channelKey:
          type: string
        accepted:
          type: boolean
        deliveryId:
          type:
            - string
            - "null"
        reason:
          type:
            - string
            - "null"
    PassageSignificance:
      type: string
      enum:
        - NORMAL
        - ANCHOR
    NotebookAppendRequest:
      type: object
      required:
        - scope
        - significance
        - abstract
        - content
      additionalProperties: false
      properties:
        datetime:
          type: string
          description: Optional ISO-8601 datetime. Stored as UTC; file partitioning uses configured room timezone.
        scope:
          type: string
          pattern: ^[A-Za-z0-9_.-]+$
          description: Path-safe scope. Must not contain '..'.
        significance:
          $ref: "#/components/schemas/PassageSignificance"
        abstract:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
    NotebookAppendResponse:
      type: object
      required:
        - id
        - path
        - created
        - warnings
      additionalProperties: false
      properties:
        id:
          type: string
        path:
          type: string
        created:
          type: boolean
        warnings:
          type: array
          items:
            type: string
    NotebookRecentRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          pattern: ^[A-Za-z0-9_.-]+$
        days:
          type: integer
          minimum: 1
          maximum: 30
          default: 5
        significance:
          $ref: "#/components/schemas/PassageSignificance"
        limit:
          type: integer
          minimum: 1
          maximum: 100
    NotebookSelectExactRequest:
      type: object
      required:
        - year
        - month
        - day
      additionalProperties: false
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
        scope:
          type: string
          pattern: ^[A-Za-z0-9_.-]+$
        limit:
          type: integer
          minimum: 1
          maximum: 100
    NotebookSearchRequest:
      type: object
      required:
        - query
      additionalProperties: false
      properties:
        query:
          type: string
        scope:
          type: string
          pattern: ^[A-Za-z0-9_.-]+$
        limit:
          type: integer
          minimum: 1
          maximum: 100
    NotebookCurrentRequest:
      type: object
      required:
        - scope
      additionalProperties: false
      properties:
        scope:
          type: string
          pattern: ^[A-Za-z0-9_.-]+$
