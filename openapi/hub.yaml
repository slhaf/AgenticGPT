openapi: 3.1.0
info:
  title: Agentic GPT Hub API
  version: 0.3.1
servers:
  - url: https://agentic-gpt.example.com
security:
  - bearerAuth: []
paths:
  /v1/info:
    get:
      operationId: getInfo
      description: Return Hub runtime metadata, public base URL, remote confirmation status, and safe aggregate counts.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Safe Hub runtime information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/agents:
    get:
      operationId: listAgents
      description: List registered local agents, online status, capabilities, and safe config summaries. Use this before choosing an agentId.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Enabled agents with safe configuration summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/process/exec:
    post:
      operationId: processExec
      description: Start one managed process and wait briefly. Complete inline output and result are included only when the serialized creation response fits within 8192 bytes; overflow output uses a shared stdout/stderr preview capped at 2048 bytes. Use process status/output/result/cancel routes for lifecycle follow-up.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessExecRequest"
      responses:
        "200":
          description: Managed process creation status with bounded inline completion evidence or a typed validation/admission error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProcessResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/process/batch:
    post:
      operationId: processBatch
      description: Atomically admit multiple managed processes under one confirmation decision. The full batch response shares an 8192-byte inline budget and bounded output previews; use process status/output/result/cancel routes for lifecycle control.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessBatchExecRequest"
      responses:
        "200":
          description: Managed process batch status and ordered child process responses, or a typed validation/admission error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProcessBatchResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/process:
    get:
      operationId: listProcesses
      description: List active or recently retained managed processes for one local Agentic agent with optional group/kind/state filters and cursor pagination. If the Agent is unavailable, cached status metadata is returned with explicit freshness; cursors issued by the Agent cannot be continued from cache.
      x-openai-isConsequential: false
      parameters:
        - name: agentId
          in: query
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcessKind"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcessState"
        - name: group
          in: query
          required: false
          description: Exact human-readable workstream filter.
          schema:
            type: string
            minLength: 1
            maxLength: 32
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by a prior process.list response.
          schema:
            type: string
      responses:
        "200":
          description: Active or recently retained process status metadata, with freshness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Agent unavailable while continuing an Agent-issued cursor; no cache-generated cursor is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessListUnavailableResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/process/{processId}:
    get:
      operationId: getProcessStatus
      description: Inspect or briefly wait for managed process status only. Status never includes stdout, stderr, or result data; cached metadata is explicitly marked when the Agent is unavailable.
      x-openai-isConsequential: false
      parameters:
        - name: processId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
        - name: waitSeconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 30
            default: 5
      responses:
        "200":
          description: Current process status, or explicitly cache-only status when the Agent is unavailable.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProcessStatusResponse"
                  - $ref: "#/components/schemas/ProcessCacheFallbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Agent unavailable without a cached process status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessUnavailableResponse"
  /v1/process/{processId}/output:
    get:
      operationId: getProcessOutput
      description: Read a non-consuming output page from both process streams. Cursor offsets are raw-byte coordinates; the response preserves invalid UTF-8 with base64 encoding and explicitly reports retention gaps and EOF.
      x-openai-isConsequential: false
      parameters:
        - name: processId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Opaque process-bound cursor for two absolute raw-byte stream offsets; omission starts from zero and reports any retention gaps.
          schema:
            type: string
        - name: maxBytes
          in: query
          required: false
          description: Maximum aggregate encoded bytes in the page; defaults to 8192 and is capped at 32768.
          schema:
            type: integer
            minimum: 1
            maximum: 32768
            default: 8192
      responses:
        "200":
          description: Lossless stdout and stderr page with cursor, gap, capture, and EOF evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessOutputResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Agent unavailable; output is never synthesized from Hub metadata cache.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessUnavailableResponse"
  /v1/process/{processId}/result:
    get:
      operationId: getProcessResult
      description: Read an explicitly retained structured result or an accurate unavailable status. Hub metadata cache never supplies process result content, and oversized or unretained results are never represented as partial JSON.
      x-openai-isConsequential: false
      parameters:
        - name: processId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
        - name: maxBytes
          in: query
          description: Maximum retained result payload bytes to include; defaults to 8192 and is capped at 524288.
          schema:
            type: integer
            minimum: 1
            maximum: 524288
            default: 8192
      responses:
        "200":
          description: Retained structured result or explicit unavailable result status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessResultResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Agent unavailable; result content is never synthesized from Hub metadata cache.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessUnavailableResponse"
  /v1/process/{processId}/cancel:
    post:
      operationId: cancelProcess
      description: Request kind-aware cancellation for one managed process and return observed termination evidence.
      x-openai-isConsequential: true
      parameters:
        - name: processId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Process cancellation outcome and observed termination evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessCancelResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          description: Hub could not deliver the cancellation request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessUnavailableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tmux/sessions:
    get:
      operationId: tmuxListSessions
      description: List persistent tmux shared workspaces. Start tmux workflows here, then use tmuxListPanes to locate the relevant pane.
      x-openai-isConsequential: false
      parameters:
        - name: agentId
          in: query
          required: true
          description: Target enabled local Agentic agent id.
          schema:
            type: string
      responses:
        "200":
          description: tmux sessions or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxListSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/panes:
    get:
      operationId: tmuxListPanes
      description: List tmux panes and their cwd, foreground command, process/mode state, and isLikelyShell. Use tmuxExec for shell panes and tmuxPasteText for non-shell panes.
      x-openai-isConsequential: false
      parameters:
        - name: agentId
          in: query
          required: true
          description: Target enabled local Agentic agent id.
          schema:
            type: string
        - name: session
          in: query
          required: false
          description: Optional tmux session name to scope pane listing.
          schema:
            type: string
      responses:
        "200":
          description: Matching tmux panes or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxListPanesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/capture:
    post:
      operationId: tmuxCapturePane
      description: Capture recent pane history before acting or to observe progress after tmuxExec. This is read-only.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxCaptureRequest"
      responses:
        "200":
          description: Pane capture or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxCaptureResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/exec:
    post:
      operationId: tmuxExec
      description: Submit one structured program and argument vector atomically to a tmux shell pane. Pane cwd, command policy, path policy, confirmation, and audit apply. Returns a bounded post-submit pane snapshot after waitMs. Submission does not prove completion; use exec when an exit status is required.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxExecRequest"
      responses:
        "200":
          description: Submission result or a structured policy/agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/paste:
    post:
      operationId: tmuxPasteText
      description: Paste text into a non-shell tmux pane or TUI. Shell panes are rejected and must use tmuxExec. Confirmation defaults to true.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxPasteRequest"
      responses:
        "200":
          description: Paste result or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/sessions/create:
    post:
      operationId: tmuxCreateSession
      description: Create an idempotent persistent tmux workspace when no suitable session exists. Prefer reusing the default agentic session. cwd is checked by local path policy.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxCreateSessionRequest"
      responses:
        "200":
          description: Session creation result or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/sessions/close:
    post:
      operationId: tmuxCloseSession
      description: Close a persistent tmux workspace only when explicitly no longer needed. Confirmation defaults to true.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxCloseSessionRequest"
      responses:
        "200":
          description: Session close result or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/servers:
    post:
      operationId: mcpListServers
      description: List MCP servers configured inside one local Agentic agent, or all currently connected agents when agentId is omitted.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpListServersRequest"
      responses:
        "200":
          description: Configured MCP servers on the selected local agent, or grouped by connected agent when agentId is omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpListServersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/tools:
    post:
      operationId: mcpListTools
      description: List tools exposed by one MCP server configured inside a local Agentic agent.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpListToolsRequest"
      responses:
        "200":
          description: Tools exposed by a configured MCP server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpListToolsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/callTool:
    post:
      operationId: mcpCallTool
      description: Start a managed downstream MCP tool process through a local Agentic agent. Returns its process status and bounded inline result; use process.result/process.cancel for later result or cancellation evidence.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpCallToolRequest"
      responses:
        "200":
          description: Downstream MCP process creation status or a typed validation/admission error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProcessResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/batch:
    post:
      operationId: mcpBatch
      description: Atomically admit 1..16 managed downstream MCP child processes with one aggregate confirmation, bounded global/per-server concurrency, ordered child status projections, and optional fail-fast scheduling.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpBatchRequest"
      responses:
        "200":
          description: Managed MCP batch status and ordered child process projections, or a typed preflight/capacity error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/McpBatchToolResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/notify/channels:
    get:
      operationId: userNotifyChannels
      description: List Hub-native user notification channels. This does not use the active Room Agent.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Available and unavailable notification channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotifyChannelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/notify/send:
    post:
      operationId: userNotifySend
      description: Send a Hub-native notification to the user through a selected channel. This does not use the active Room Agent.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserNotifySendRequest"
      responses:
        "200":
          description: Notification send result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotifySendResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/room/diary/active:
    post:
      operationId: roomDiaryActive
      description: Read the active daily, weekly, and monthly Room diary documents from the active Room Agent. The response is bounded and may include a typed missing, unreadable, or invalid-UTF-8 result for an individual layer; no agentId is accepted.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomDiaryActiveRequest"
      responses:
        "200":
          description: Active Room diary layer results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDiaryActiveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: JSON body extraction failed before Room dispatch.
          content:
            text/plain:
              schema:
                type: string
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/diary/read:
    post:
      operationId: roomDiaryRead
      description: Read one exact Room diary document by validated layer and period. Daily accepts current or YYYY-MM-DD; weekly and monthly accept current or an ordered YYYY-MM-DD--YYYY-MM-DD range. No agentId is accepted.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomDiaryReadRequest"
      responses:
        "200":
          description: One bounded Room diary layer result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDiaryReadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: JSON body extraction failed before Room dispatch.
          content:
            text/plain:
              schema:
                type: string
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/recent:
    post:
      operationId: roomNotebookRecent
      description: Read bounded recent previews of current Room Notebook Markdown documents. This public name now uses the current Markdown DTO, not the retired passage-oriented JSONL contract; no agentId is accepted.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomNotebookRecentRequest"
      responses:
        "200":
          description: Bounded recent Notebook Markdown previews and optional warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomNotebookResultsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: JSON body extraction failed before Room dispatch.
          content:
            text/plain:
              schema:
                type: string
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/search:
    post:
      operationId: roomNotebookSearch
      description: Search current Room Notebook Markdown by a bounded case-insensitive substring over relative paths, H1 titles, and bodies. This public name now uses the current Markdown DTO, not the retired passage-oriented JSONL contract; no agentId is accepted.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomNotebookSearchRequest"
      responses:
        "200":
          description: Bounded matching Notebook Markdown previews and optional warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomNotebookResultsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: JSON body extraction failed before Room dispatch.
          content:
            text/plain:
              schema:
                type: string
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/room/notebook/read:
    post:
