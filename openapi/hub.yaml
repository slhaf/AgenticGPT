        displayName:
          type: string
        online:
          type: boolean
        servers:
          type: array
          items:
            $ref: "#/components/schemas/McpServerSummary"
        error:
          type: object
          additionalProperties: true
          description: Per-agent error if the Hub could not retrieve that agent's MCP servers.
    McpListToolsRequest:
      type: object
      required:
        - agentId
        - serverId
      additionalProperties: false
      properties:
        agentId:
          type: string
        serverId:
          type: string
    McpCallToolRequest:
      type: object
      required:
        - agentId
        - serverId
        - toolName
        - arguments
      additionalProperties: false
      properties:
        agentId:
          type: string
        serverId:
          type: string
        toolName:
          type: string
        arguments:
          type: object
          additionalProperties: true
          properties: {}
          description: Downstream tool arguments; maximum serialized size 256 KiB.
        waitSeconds:
          type: integer
          minimum: 0
          maximum: 30
          default: 5
          description: Bounded inline wait before returning the managed process response.
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 900
          default: 300
          description: Absolute downstream execution deadline.
    McpListToolsResponse:
      type: object
      required:
        - tools
      additionalProperties: false
      properties:
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              name:
                type: string
              description:
                type: string
              inputSchema:
                type: object
                additionalProperties: true
                properties: {}
    McpBatchMode:
      type: string
      enum: [parallel, sequential]
      default: parallel
    McpBatchCall:
      type: object
      required: [serverId, toolName]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._:-]+$"
          description: Optional unique stable call id within the batch.
        serverId:
          type: string
        toolName:
          type: string
        arguments:
          type: object
          additionalProperties: true
          properties: {}
          description: Per-call downstream arguments; maximum serialized size 256 KiB.
    McpBatchRequest:
      type: object
      required: [agentId, calls]
      additionalProperties: false
      properties:
        agentId:
          type: string
        calls:
          type: array
          minItems: 1
          maxItems: 16
          description: Ordered calls; aggregate serialized arguments are capped at 2 MiB.
          items:
            $ref: "#/components/schemas/McpBatchCall"
        mode:
          $ref: "#/components/schemas/McpBatchMode"
        failFast:
          type: boolean
          default: false
          description: Prevent not-yet-started children from starting after a hard child failure; already-started calls are never cancelled.
        waitSeconds:
          type: integer
          minimum: 0
          maximum: 30
          default: 5
          description: Bounded inline wait for the ordered child process response.
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 900
          default: 300
          description: Per-child downstream execution deadline after scheduler admission.

