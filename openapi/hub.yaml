        activatedAt:
          type: string
    ProcessExecRequest:
      type: object
      required:
        - agentId
        - program
        - args
        - needConfirm
      additionalProperties: false
      properties:
        agentId:
          type: string
        group:
          type: string
          minLength: 1
          maxLength: 32
          description: Optional human-readable workstream key inherited by this managed process.
        program:
          type: string
        args:
          type: array
          items:
            type: string
        needConfirm:
          type: boolean
        confirmMethod:
          type: string
          enum:
            - default
            - freedesktop
            - hub
            - freedesktop-then-hub
            - freedesktopThenHub
          description: Optional per-request confirmation provider override. Omit or use default to follow the local agent configuration.
        workingDirectory:
          type: string
          description: Optional command working directory. Relative values are resolved from the agent workspace root. The resolved directory must exist and be inside writable roots, not denied roots.
        waitSeconds:
          type: integer
          minimum: 0
          maximum: 30
          default: 5
          description: Bounded inline wait. The process remains inspectable when still active after this interval.
    ProcessBatchExecRequest:
      type: object
      required:
        - agentId
        - elements
        - needConfirm
      additionalProperties: false
      properties:
        agentId:
          type: string
        group:
          type: string
          minLength: 1
          maxLength: 32
          description: Optional human-readable workstream key inherited by every child process.
        elements:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - program
              - args
            additionalProperties: false
            properties:
              program:
                type: string
              args:
                type: array
                items:
                  type: string
              workingDirectory:
                type: string
                description: Optional per-element working directory. Overrides the batch workingDirectory for this element.
        needConfirm:
          type: boolean
        confirmMethod:
          type: string
          enum:
            - default
            - freedesktop
            - hub
            - freedesktop-then-hub
            - freedesktopThenHub
          description: Optional per-request confirmation provider override for all batch elements. Omit or use default to follow the local agent configuration.
        workingDirectory:
          type: string
          description: Optional default working directory for all batch elements. Relative values are resolved from the agent workspace root. Per-element workingDirectory values override this.
        waitSeconds:
          type: integer
          minimum: 0
          maximum: 30
          default: 5
          description: Bounded inline wait for all admitted child processes.
    ProcessKind:
      type: string
      enum: [command, skill, mcp]
    ProcessState:
      type: string
      enum:
        - queued
        - waiting_confirmation
        - starting
        - running
        - completed
        - failed
        - rejected
        - cancel_requested
        - cancelled
        - timed_out
        - detached
        - unknown_after_restart
        - skipped
    ProcessCaptureStatus:
      type: string
      enum: [not_started, capturing, complete, incomplete, not_applicable]
    ProcessInfo:
      type: object
      description: Metadata-only managed process status. It never contains stdout, stderr, or result bodies.
      required: [agentId, processId, kind, state, createdAt, updatedAt, captureStatus]
      properties:
        agentId:
          type: string
        processId:
          type: string
        group:
          type: string
        batchId:
          type: string
        batchCallId:
          type: string
        batchIndex:
          type: integer
          minimum: 0
        kind:
          $ref: "#/components/schemas/ProcessKind"
        state:
          $ref: "#/components/schemas/ProcessState"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        program:
          type: string
        args:
          type: array
          items:
            type: string
        workingDirectory:
          type: string
        commandPreview:
          type: string
        exitCode:
          type: integer
        rejectReason:
          type: string
        skillId:
          type: string
        skillPath:
          type: string
        installedDigest:
          type: string
        mcpServerId:
          type: string
        mcpToolName:
          type: string
        cancelRequested:
          type: boolean
        cancelOutcome:
          type: string
          description: Bounded kind-specific cancellation outcome such as cancelled, notification_sent, detached, already_terminal, or cancel_failed.
        terminationEvidence:
          type: string
          description: Bounded evidence describing the local/remote event actually observed.
        captureStatus:
          $ref: "#/components/schemas/ProcessCaptureStatus"
        captureError:
          type: string
    ProcessFreshness:
      type: string
      enum: [live, cached, stale, unknown]
      description: Freshness of the Hub process metadata projection, not a ProcessInfo field.
    ProcessError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
    ProcessListItem:
      type: object
      required: [processId, kind, state, createdAt, captureStatus]
      additionalProperties: false
      properties:
        processId:
          type: string
        group:
          type: string
        kind:
          $ref: "#/components/schemas/ProcessKind"
        state:
          $ref: "#/components/schemas/ProcessState"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        captureStatus:
          $ref: "#/components/schemas/ProcessCaptureStatus"
    ProcessListResponse:
      type: object
      required: [processes, freshness]
      additionalProperties: false
      properties:
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessListItem"
        nextCursor:
          type: string
        freshness:
          $ref: "#/components/schemas/ProcessFreshness"
        observedAt:
          type: string
          format: date-time
    ProcessStatusResponse:
      allOf:
        - $ref: "#/components/schemas/ProcessInfo"
        - type: object
          required: [freshness, observedAt]
          properties:
            waitElapsedMs:
              type: integer
              minimum: 0
            freshness:
              $ref: "#/components/schemas/ProcessFreshness"
            observedAt:
              type: string
              format: date-time
      unevaluatedProperties: false
    ProcessCacheFallbackResponse:
      type: object
      required: [processId, error, cached, freshness, observedAt]
      additionalProperties: false
      properties:
        processId:
          type: string
        error:
          $ref: "#/components/schemas/ProcessError"
        cached:
          $ref: "#/components/schemas/ProcessListItem"
        freshness:
          $ref: "#/components/schemas/ProcessFreshness"
        observedAt:
          type: string
          format: date-time
    ProcessListUnavailableResponse:
      type: object
      required: [status, error, freshness]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [unavailable]
        error:
          $ref: "#/components/schemas/ProcessError"
        freshness:
          $ref: "#/components/schemas/ProcessFreshness"
    ProcessUnavailableResponse:
      type: object
      required: [processId, status, error, freshness]
      additionalProperties: false
      properties:
        processId:
          type: string
        status:
          type: string
          enum: [unavailable]
        error:
          $ref: "#/components/schemas/ProcessError"
        cached:
          $ref: "#/components/schemas/ProcessListItem"
        freshness:
          $ref: "#/components/schemas/ProcessFreshness"
        observedAt:
          type: string
          format: date-time
    ProcessOutputEncoding:
      type: string
      enum: [utf8, base64]
    ProcessOutputGap:
      type: object
      required: [startOffset, endOffset]
      additionalProperties: false
      properties:
        startOffset:
          type: string
          pattern: "^[0-9]+$"
          description: Absolute raw-byte offset encoded as a decimal string.
        endOffset:
          type: string
          pattern: "^[0-9]+$"
          description: Absolute raw-byte offset encoded as a decimal string.
    ProcessOutputSegment:
      type: object
      required: [data, startOffset, endOffset, encoding]
      additionalProperties: false
      properties:
        data:
          type: string
          description: Exact output slice encoded as UTF-8 text or base64 bytes.
        startOffset:
          type: string
          pattern: "^[0-9]+$"
          description: Absolute raw-byte start offset encoded as a decimal string.
        endOffset:
          type: string
          pattern: "^[0-9]+$"
          description: Absolute raw-byte end offset encoded as a decimal string.
        encoding:
          $ref: "#/components/schemas/ProcessOutputEncoding"
        gap:
          $ref: "#/components/schemas/ProcessOutputGap"
    ProcessOutputResponse:
      type: object
      required: [processId, stdout, stderr, nextCursor, hasMore, eof, captureStatus]
      additionalProperties: false
      properties:
        processId:
          type: string
        stdout:
          $ref: "#/components/schemas/ProcessOutputSegment"
        stderr:
          $ref: "#/components/schemas/ProcessOutputSegment"
        nextCursor:
          type: string
          description: Opaque process-bound cursor carrying both stream offsets.
        hasMore:
          type: boolean
        eof:
          type: boolean
          description: True only when process output capture has actually reached EOF.
        captureStatus:
          $ref: "#/components/schemas/ProcessCaptureStatus"
    ProcessResultStatus:
      type: string
      enum: [complete, too_large, unavailable]
    ProcessResultResponse:
      type: object
      required: [processId, status, resultAvailable]
      additionalProperties: false
      properties:
        processId:
          type: string
        status:
          $ref: "#/components/schemas/ProcessResultStatus"
        resultAvailable:
          type: boolean
        result:
          description: Complete retained JSON result; never a truncated JSON fragment.
        error:
          $ref: "#/components/schemas/ProcessError"
        resultBytes:
          type: integer
          minimum: 0
        resultSha256:
          type: string
        resultPreview:
          type: string
    ProcessCancelResponse:
      type: object
      required: [processId, state, cancelOutcome, terminationEvidence, freshness, observedAt]
      additionalProperties: false
      properties:
        processId:
          type: string
        state:
          $ref: "#/components/schemas/ProcessState"
        cancelOutcome:
          type: string
          description: Bounded kind-specific cancellation outcome.
        terminationEvidence:
          type: string
          description: Bounded evidence describing the local or remote event actually observed.
        error:
          $ref: "#/components/schemas/ProcessError"
        freshness:
          $ref: "#/components/schemas/ProcessFreshness"
        observedAt:
          type: string
          format: date-time
    ProcessInlineStream:
      type: object
      required: [data, encoding]
      additionalProperties: false
      properties:
        data:
          type: string
        encoding:
          $ref: "#/components/schemas/ProcessOutputEncoding"
    ProcessInlineOutput:
      type: object
      required: [stdout, stderr]
      additionalProperties: false
      properties:
        stdout:
          $ref: "#/components/schemas/ProcessInlineStream"
        stderr:
          $ref: "#/components/schemas/ProcessInlineStream"
    ProcessOutputPreview:
      type: object
      required: [stdout, stderr, truncated]
      additionalProperties: false
      properties:
        stdout:
          type: string
        stderr:
          type: string
        truncated:
          type: boolean
    ProcessResponse:
      type: object
      description: Creation status with flattened ProcessInfo fields. Complete inline output/result is included only when the serialized response fits within 8192 bytes; overflow output uses a shared stdout/stderr preview capped at 2048 bytes.
      allOf:
        - $ref: "#/components/schemas/ProcessInfo"
        - type: object
          required: [status, completedInline, pollAfterMs, resultAvailable]
          properties:
            status:
              $ref: "#/components/schemas/ProcessState"
            completedInline:
              type: boolean
            pollAfterMs:
              type: integer
              minimum: 0
            inlineOutput:
              $ref: "#/components/schemas/ProcessInlineOutput"
            outputPreview:
              $ref: "#/components/schemas/ProcessOutputPreview"
            result:
              description: Complete retained structured result, if available.
            resultStatus:
              $ref: "#/components/schemas/ProcessResultStatus"
            resultAvailable:
              type: boolean
            resultBytes:
              type: integer
              minimum: 0
            resultSha256:
              type: string
            resultPreview:
              type: string
            error:
              $ref: "#/components/schemas/ProcessError"
      unevaluatedProperties: false
    ProcessBatchResponse:
      type: object
      description: Ordered child responses under a batch-wide 8192-byte complete-inline budget.
      required: [batchId, status, completedInline, pollAfterMs, processes]
      additionalProperties: false
      properties:
        batchId:
          type: string
        status:
          type: string
        completedInline:
          type: boolean
        pollAfterMs:
          type: integer
          minimum: 0
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessResponse"
    ProcessToolResponse:
      type: object
      required: [processId, state, resultAvailable]
      additionalProperties: false
      properties:
        processId:
          type: string
        group:
          type: string
        kind:
          $ref: "#/components/schemas/ProcessKind"
        state:
          $ref: "#/components/schemas/ProcessState"
        elapsedMs:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          minimum: 0
        exitCode:
          type: integer
        error:
          $ref: "#/components/schemas/ProcessError"
        resultStatus:
          $ref: "#/components/schemas/ProcessResultStatus"
        resultAvailable:
          type: boolean
        resultBytes:
          type: integer
          minimum: 0
        resultSha256:
          type: string
        resultPreview:
          type: string
    ProcessBatchToolResponse:
      type: object
      required: [batchId, status, results]
      additionalProperties: false
      properties:
        batchId:
          type: string
        status:
          type: string
        results:
          type: array
          minItems: 0
          description: Child process status projections in original input order.
          items:
            $ref: "#/components/schemas/ProcessToolResponse"
    McpBatchStatus:
      type: string
      enum: [running, completed, completed_with_errors, rejected]
    McpBatchToolResponse:
      type: object
      required: [status, results]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/McpBatchStatus"
        error:
          $ref: "#/components/schemas/ProcessError"
        results:
          type: array
          minItems: 1
          maxItems: 16
          description: Flat child process status projections in original input order.
          items:
            $ref: "#/components/schemas/ProcessToolResponse"
