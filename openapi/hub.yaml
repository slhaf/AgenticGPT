openapi: 3.1.0
info:
  title: Agentic GPT Hub API
  version: 0.3.1
servers:
  - url: https://agentic-gpt.example.com
security:
  - bearerAuth: []
paths:
  /v1/info:
    get:
      operationId: getInfo
      description: Return Hub runtime metadata, public base URL, remote confirmation status, and safe aggregate counts.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Safe Hub runtime information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/agents:
    get:
      operationId: listAgents
      description: List registered local agents, online status, capabilities, and safe config summaries. Use this before choosing an agentId.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Enabled agents with safe configuration summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/events:
    get:
      operationId: listEvents
      description: List one explicitly selected enabled Agent's persisted inbox. Defaults to pending events and 20 items; hidden pending events remain listable. The response includes the Agent's compact events panel when available. Offline, timeout, and Hub errors omit events.
      x-openai-isConsequential: false
      parameters:
        - name: agentId
          in: query
          required: true
          description: Target enabled local Agentic agent id; this API never selects or merges agents.
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EventStatus"
            default: pending
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EventSeverity"
        - name: limit
          in: query
          required: false
          description: Defaults to 20; the Agent clamps the effective page size to 1 through 100.
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by a prior listEvents response, scoped to the same Agent and filters.
          schema:
            type: string
      responses:
        "200":
          description: Flat event list DTO plus the optional compact Agent events panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
              examples:
                page:
                  summary: Pending events and compact panel
                  value:
                    items:
                      - eventId: evt_example
                        summary: Process completed
                        severity: low
                        createdAt: "2026-10-01T12:00:00Z"
                        status: pending
                    events:
                      current: "low: 1 | medium: 0 | high: 0"
                      new:
                        - "evt_example | Process completed": "low | 2026-10-01T12:00:00Z"
        "400":
          $ref: "#/components/responses/AgentError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AgentError"
        "500":
          $ref: "#/components/responses/AgentError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/events/{eventId}:
    get:
      operationId: getEvent
      description: Read one full event record for the explicitly selected enabled Agent. Reading does not mark it handled. The response includes the Agent's compact events panel when available; offline, timeout, and Hub errors omit events.
      x-openai-isConsequential: false
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          description: Target enabled local Agentic agent id; event IDs are never looked up across agents.
          schema:
            type: string
      responses:
        "200":
          description: Full flat event record plus the optional compact Agent events panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGetResponse"
              examples:
                record:
                  summary: Event record with its source and compact panel
                  value:
                    eventId: evt_example
                    message: Process completed successfully
                    severity: low
                    createdAt: "2026-10-01T12:00:00Z"
                    status: pending
                    source:
                      kind: process
                      ref: process-1
                    shownCount: 1
                    expiresAt: "2026-10-02T12:00:00Z"
                    events:
                      current: "low: 1 | medium: 0 | high: 0"
                      new:
                        - "evt_example | Process completed": "low | 2026-10-01T12:00:00Z"
        "400":
          $ref: "#/components/responses/AgentError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AgentError"
        "500":
          $ref: "#/components/responses/AgentError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/events/mark:
    post:
      operationId: markEvents
      description: Idempotently mark selected events in one explicitly selected enabled Agent's inbox as handled. Unknown IDs are returned in notFoundIds; this changes only inbox handling state. The response includes the Agent's compact events panel when available; offline, timeout, and Hub errors omit events.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventMarkRequest"
            examples:
              mark:
                summary: Mark a batch in one Agent inbox
                value:
                  agentId: agent-example
                  eventIds: [evt_example, evt_other]
      responses:
        "200":
          description: Handled and unknown event IDs, plus the optional compact Agent events panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMarkResponse"
              examples:
                marked:
                  summary: Per-ID result
                  value:
                    handledIds: [evt_example]
                    notFoundIds: [evt_other]
                    events:
                      current: "low: 0 | medium: 0 | high: 0"
                      new: []
        "400":
          $ref: "#/components/responses/AgentError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AgentError"
        "500":
          $ref: "#/components/responses/AgentError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/process/exec:
    post:
      operationId: processExec
      description: 在指定 Agent 上启动一个受管进程并短暂等待首响。成功返回紧凑 ProcessResponse；waitSeconds 只控制本次等待，不能推断超时后进程未启动或已取消。后续用首响中的 agentId/processId 调用 /read 或 /cancel。
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessExecRequest"
      responses:
        "200":
          description: 紧凑 ProcessResponse，或类型化的参数/准入错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProcessExecResponse"
                  - $ref: "#/components/schemas/AgentErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/process/batch:
    post:
      operationId: processBatch
      description: 在一次确认与批次准入边界内启动多个受管进程。完整 ProcessBatchResponse 共享一个响应字节预算；已启动项的副作用不会回滚。waitSeconds 只控制首响等待，后续按每个进程的 agentId/processId 调用 /read 或 /cancel。
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessBatchExecRequest"
      responses:
        "200":
          description: 批次状态及按输入顺序排列的紧凑子进程响应，或类型化的参数/准入错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProcessBatchResponse"
                  - $ref: "#/components/schemas/AgentErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/process:
    get:
      operationId: listProcesses
      description: 列出指定本地 Agent 当前活动或近期保留的托管进程，可按 group/kind/state 筛选并用 cursor 分页。在线结果由 Agent 提供；Agent 不可达时只返回明确标记 freshness/observedAt 的 Hub 缓存元数据，不会生成可继续使用的新 cursor。
      x-openai-isConsequential: false
      parameters:
        - name: agentId
          in: query
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcessKind"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcessState"
        - name: group
          in: query
          required: false
          description: 按去除首尾空白后的工作分组名称精确筛选。
          schema:
            type: string
            minLength: 1
            maxLength: 32
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: process.list 先前返回的不透明分页游标。
          schema:
            type: string
      responses:
        "200":
          description: 活动或近期进程列表；响应标明 freshness 与 observedAt。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProcessListResponse"
                  - $ref: "#/components/schemas/ProcessLiveErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: 继续使用 Agent 签发的 cursor 时 Agent 不可达；缓存不能生成可继续使用的 cursor。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessListUnavailableResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/process/{processId}/read:
    get:
      operationId: readProcess
      description: 统一读取一个受管进程的状态与可用产物。默认 auto 视图有待读输出时优先返回，否则可在有界等待内等待产物、终态或采集结算；command/skill 输出支持 cursor 续读，kind=mcp 下游结果不接受输出 cursor。status 视图只等待执行终态或期限，不返回产物，且不能与 cursor 同时使用。Hub 不可达时只返回明确标记的 Hub 缓存元数据，不会从缓存伪造输出或结果。
      x-openai-isConsequential: false
      parameters:
        - name: processId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
        - name: waitSeconds
          in: query
          required: false
          description: 本次请求等待秒数；省略时为 5，范围 0–30，超过 30 时按 30 处理，0 表示立即读取。等待结束不取消进程。
          schema:
            type: integer
            minimum: 0
            maximum: 30
            default: 5
        - name: view
          in: query
          required: false
          description: 读取视图；auto 为默认值，status 仅返回进程状态元数据且不包含输出或下游结果。
          schema:
            $ref: "#/components/schemas/ProcessReadView"
        - name: cursor
          in: query
          required: false
          description: auto 视图的非消费式 command/skill 输出游标；省略时从当前进程输出起点读取。status 视图和 kind=mcp 下游结果均不接受输出 cursor。
          schema:
            type: string
        - name: maxBytes
          in: query
          required: false
          description: 整个紧凑 ProcessResponse 的 JSON UTF-8 字节预算；省略时由 Agent 使用当前 limits.processResponseBytes（出厂默认 8192），显式值范围为 4096–1048576。
          schema:
            type: integer
            minimum: 4096
            maximum: 1048576
      responses:
        "200":
          description: Agent 当前的 ProcessResponse 与独立的可选 EventPanel。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessReadResponse"
        "400":
          $ref: "#/components/responses/AgentError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AgentError"
        "500":
          $ref: "#/components/responses/AgentError"
        "503":
          description: Agent 无法读取；仅可选提供 Hub 进程元数据缓存，绝不包含输出或下游结果正文。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessUnavailableResponse"
  /v1/process/{processId}/cancel:
    post:
      operationId: cancelProcess
      description: 请求取消一个受管进程并返回实际观察到的取消结果与终止证据；请求不保证远端已经停止。
      x-openai-isConsequential: true
      parameters:
        - name: processId
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent 的 ProcessCancelResponse（processId、state、cancelOutcome、terminationEvidence 及可选 error），另可附独立的 EventPanel；或 Agent 返回的类型化错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProcessCancelResponse"
                  - $ref: "#/components/schemas/AgentErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          description: Hub could not deliver the cancellation request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessUnavailableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tmux/sessions:
    get:
      operationId: tmuxListSessions
      description: List persistent tmux shared workspaces. Start tmux workflows here, then use tmuxListPanes to locate the relevant pane.
      x-openai-isConsequential: false
      parameters:
        - name: agentId
          in: query
          required: true
          description: Target enabled local Agentic agent id.
          schema:
            type: string
      responses:
        "200":
          description: tmux sessions or a structured agent-side error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TmuxListSessionsResponse"
                  - $ref: "#/components/schemas/AgentErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/panes:
    get:
      operationId: tmuxListPanes
      description: List tmux panes and their cwd, foreground command, process/mode state, and isLikelyShell. Use tmuxExec for shell panes and tmuxPasteText for non-shell panes.
      x-openai-isConsequential: false
      parameters:
        - name: agentId
          in: query
          required: true
          description: Target enabled local Agentic agent id.
          schema:
            type: string
        - name: session
          in: query
          required: false
          description: Optional tmux session name to scope pane listing.
          schema:
            type: string
      responses:
        "200":
          description: Matching tmux panes or a structured agent-side error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TmuxListPanesResponse"
                  - $ref: "#/components/schemas/AgentErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/capture:
    post:
      operationId: tmuxCapturePane
      description: Capture recent pane history before acting or to observe progress after tmuxExec. This is read-only.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxCaptureRequest"
      responses:
        "200":
          description: Pane capture or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxCaptureResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/exec:
    post:
      operationId: tmuxExec
      description: Submit one structured program and argument vector atomically to a tmux shell pane. Pane cwd, command policy, path policy, confirmation, and audit apply. Returns a bounded post-submit pane snapshot after waitMs. Submission does not prove completion; use exec when an exit status is required.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxExecRequest"
      responses:
        "200":
          description: Submission result or a structured policy/agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/paste:
    post:
      operationId: tmuxPasteText
      description: Paste text into a non-shell tmux pane or TUI. Shell panes are rejected and must use tmuxExec. Confirmation defaults to true.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxPasteRequest"
      responses:
        "200":
          description: Paste result or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/sessions/create:
    post:
      operationId: tmuxCreateSession
      description: Create an idempotent persistent tmux workspace when no suitable session exists. Prefer reusing the default agentic session. cwd is checked by local path policy.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxCreateSessionRequest"
      responses:
        "200":
          description: Session creation result or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/tmux/sessions/close:
    post:
      operationId: tmuxCloseSession
      description: Close a persistent tmux workspace only when explicitly no longer needed. Confirmation defaults to true.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TmuxCloseSessionRequest"
      responses:
        "200":
          description: Session close result or a structured agent-side error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmuxOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/servers:
    post:
      operationId: mcpListServers
      description: List MCP servers configured inside one local Agentic agent, or all currently connected agents when agentId is omitted.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpListServersRequest"
      responses:
        "200":
          description: Configured MCP servers on the selected local agent, or grouped by connected agent when agentId is omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpListServersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/tools:
    post:
      operationId: mcpListTools
      description: List tools exposed by one MCP server configured inside a local Agentic agent.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpListToolsRequest"
      responses:
        "200":
          description: Tools exposed by a configured MCP server.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/McpListToolsResponse"
                  - $ref: "#/components/schemas/AgentErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/callTool:
    post:
      operationId: mcpCallTool
      description: 在指定本地 Agent 上调用一个已发现的下游 MCP 工具；调用前先核对 serverId、toolName、参数 schema 和副作用。返回统一 ProcessResponse 及预算内的可选 mcpResult；下游副作用不会由 Hub 回滚，超时不等于取消。之后用相同 agentId/processId 调用 /read 或 /cancel。
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpCallToolRequest"
      responses:
        "200":
          description: Downstream MCP process creation status or a typed validation/admission error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProcessExecResponse"
                  - $ref: "#/components/schemas/AgentErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/mcp/batch:
    post:
      operationId: mcpBatch
      description: Atomically admit 1..16 managed downstream MCP child processes with one aggregate confirmation, bounded global/per-server concurrency, ordered compact ProcessResponse children with their input index and optional id, and optional fail-fast scheduling.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpBatchRequest"
      responses:
        "200":
          description: MCP batchId/status and ordered compact ProcessResponse children with index and optional id, or a typed preflight/capacity error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/McpBatchToolResponse"
                  - $ref: "#/components/schemas/AgentErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /v1/notify/channels:
    get:
