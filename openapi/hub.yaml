              args:
                type: array
                items:
                  type: string
              workingDirectory:
                type: string
                description: Optional per-element working directory. Overrides the batch workingDirectory for this element.
        needConfirm:
          type: boolean
        confirmMethod:
          type: string
          enum:
            - default
            - freedesktop
            - hub
            - freedesktop-then-hub
            - freedesktopThenHub
          description: Optional per-request confirmation provider override for all batch elements. Omit or use default to follow the local agent configuration.
        workingDirectory:
          type: string
          description: Optional default working directory for all batch elements. Relative values are resolved from the agent workspace root. Per-element workingDirectory values override this.
        waitSeconds:
          type: integer
          minimum: 0
          maximum: 30
          default: 5
          description: Bounded inline wait for all admitted child processes.
    ProcessKind:
      type: string
      enum: [command, skill, mcp]
    ProcessState:
      type: string
      enum:
        - queued
        - waiting_confirmation
        - starting
        - running
        - completed
        - failed
        - rejected
        - cancel_requested
        - cancelled
        - timed_out
        - detached
        - unknown_after_restart
        - skipped
    ProcessCaptureStatus:
      type: string
      enum: [not_started, capturing, complete, incomplete, not_applicable]
    ProcessInfo:
      type: object
      description: Metadata-only managed process status. It never contains stdout, stderr, or result bodies.
      required: [agentId, processId, kind, state, createdAt, updatedAt, captureStatus]
      properties:
        agentId:
          type: string
        processId:
          type: string
        group:
          type: string
        batchId:
          type: string
        batchCallId:
          type: string
        batchIndex:
          type: integer
          minimum: 0
        kind:
          $ref: "#/components/schemas/ProcessKind"
        state:
          $ref: "#/components/schemas/ProcessState"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        program:
          type: string
        args:
          type: array
          items:
            type: string
        workingDirectory:
          type: string
        commandPreview:
          type: string
        exitCode:
          type: integer
        rejectReason:
          type: string
        skillId:
          type: string
        skillPath:
          type: string
        installedDigest:
          type: string
        mcpServerId:
          type: string
        mcpToolName:
          type: string
        cancelRequested:
          type: boolean
        cancelOutcome:
          type: string
          description: Bounded kind-specific cancellation outcome such as cancelled, notification_sent, detached, already_terminal, or cancel_failed.
        terminationEvidence:
          type: string
          description: Bounded evidence describing the local/remote event actually observed.
        captureStatus:
          $ref: "#/components/schemas/ProcessCaptureStatus"
        captureError:
          type: string
    ProcessFreshness:
      type: string
      enum: [live, cached, stale, unknown]
      description: Freshness of the Hub process metadata projection, not a ProcessInfo field.
    ProcessError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
    ProcessListItem:
      type: object
      required: [processId, kind, state, createdAt, captureStatus]
      additionalProperties: false
      properties:
        processId:
          type: string
        group:
          type: string
        kind:
          $ref: "#/components/schemas/ProcessKind"
        state:
          $ref: "#/components/schemas/ProcessState"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        captureStatus:
          $ref: "#/components/schemas/ProcessCaptureStatus"
    ProcessListResponse:
      oneOf:
        - $ref: "#/components/schemas/ProcessListLiveResponse"
        - $ref: "#/components/schemas/ProcessListCacheResponse"
    ProcessListLiveResponse:
      type: object
      required: [processes, freshness, observedAt]
      additionalProperties: false
      properties:
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessListItem"
        nextCursor:
          type: string
        freshness:
          type: string
          const: live
        observedAt:
          type: string
          format: date-time
        events:
          $ref: "#/components/schemas/EventPanel"
    ProcessListCacheResponse:
      type: object
      required: [processes, freshness]
      additionalProperties: false
      properties:
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessListItem"
        freshness:
          type: string
          enum: [cached, stale, unknown]
        observedAt:
          type: string
          format: date-time
    ProcessLiveErrorResponse:
      type: object
      required: [error, freshness, observedAt]
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ProcessError"
        freshness:
          type: string
          const: live
        observedAt:
          type: string
          format: date-time
        events:
          $ref: "#/components/schemas/EventPanel"
    ProcessListUnavailableResponse:
      type: object
      required: [status, error, freshness]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [unavailable]
        error:
          $ref: "#/components/schemas/ProcessError"
        freshness:
          $ref: "#/components/schemas/ProcessFreshness"
    ProcessUnavailableResponse:
      type: object
      description: Hub 无法取得 Agent 的实时读取结果；可选 cached 元数据来自 Hub 观察快照，永不包含输出或下游结果正文。
      required: [processId, status, error, freshness]
      additionalProperties: false
      properties:
        processId:
          type: string
        status:
          type: string
          enum: [unavailable]
        error:
          $ref: "#/components/schemas/ProcessError"
        cached:
          $ref: "#/components/schemas/ProcessListItem"
        freshness:
          $ref: "#/components/schemas/ProcessFreshness"
        observedAt:
          type: string
          format: date-time
    ProcessOutputEncoding:
      type: string
      enum: [utf8, base64]
    ProcessOutputGap:
      type: object
      required: [startOffset, endOffset]
      additionalProperties: false
      properties:
        startOffset:
          type: string
          pattern: "^[0-9]+$"
          description: 原始输出流中的绝对字节偏移，以十进制字符串编码。
        endOffset:
          type: string
          pattern: "^[0-9]+$"
          description: 原始输出流中的绝对字节偏移，以十进制字符串编码。
    ProcessOutputSegment:
      type: object
      required: [data, startOffset, endOffset, encoding]
      additionalProperties: false
      properties:
        data:
          type: string
          description: UTF-8 文本或 base64 编码的精确输出片段。
        startOffset:
          type: string
          pattern: "^[0-9]+$"
          description: 原始输出流的绝对起始字节偏移，以十进制字符串编码。
        endOffset:
          type: string
          pattern: "^[0-9]+$"
          description: 原始输出流的绝对结束字节偏移，以十进制字符串编码。
        encoding:
          $ref: "#/components/schemas/ProcessOutputEncoding"
        gap:
          $ref: "#/components/schemas/ProcessOutputGap"
    ProcessReadView:
      type: string
      enum: [auto, status]
      default: auto
      description: auto 优先读取可用产物并可有界等待；status 只等待执行终态或期限且不返回产物。
    ProcessOutputPage:
      type: object
      required: [stdout, stderr, nextCursor, hasMore, eof]
      additionalProperties: false
      properties:
        stdout:
          $ref: "#/components/schemas/ProcessOutputSegment"
        stderr:
          $ref: "#/components/schemas/ProcessOutputSegment"
        nextCursor:
          type: string
          description: 携带两个流当前位置的不透明进程游标。
        hasMore:
          type: boolean
        eof:
          type: boolean
          description: 仅在输出捕获确实到达 EOF 时为 true。
    ProcessMcpResultStatus:
      type: string
      enum: [pending, included, deferred, unavailable, not_retained]
      description: pending 表示仍在运行或结果尚不可取，不代表失败；deferred 表示完整结果仍可稍后读取；not_retained 表示结果已不可恢复。
    ProcessMcpResult:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/ProcessMcpResultStatus"
        bytes:
          type: integer
          minimum: 0
          description: 完整下游 MCP 结果的字节数。
        sha256:
          type: string
          description: 完整下游 MCP 结果的 SHA-256 摘要。
        value:
          type: object
          description: status=included 时包含完整 CallToolResult JSON，不会被截断。
        preview:
          type: string
          description: 可选的结果摘要文本，不代替完整 value。
    ProcessResponseBase:
      type: object
      description: 受管进程的紧凑观察结果；产物是可选字段，必须符合整个响应的 JSON 字节预算。
      required: [agentId, processId, kind, state, captureStatus]
      properties:
        agentId:
          type: string
        processId:
          type: string
        kind:
          $ref: "#/components/schemas/ProcessKind"
        state:
          $ref: "#/components/schemas/ProcessState"
        captureStatus:
          $ref: "#/components/schemas/ProcessCaptureStatus"
        group:
          type: string
        batchId:
          type: string
        batchIndex:
          type: integer
          minimum: 0
        exitCode:
          type: integer
        waitElapsedMs:
          type: integer
          minimum: 0
        error:
          $ref: "#/components/schemas/ProcessError"
        cancelOutcome:
          type: string
          description: 进程所有者实际观察到的、受限长度的取消结果。
        terminationEvidence:
          type: string
          description: 进程所有者实际观察到的终止证据。
        captureError:
          type: string
        output:
          $ref: "#/components/schemas/ProcessOutputPage"
        mcpResult:
          $ref: "#/components/schemas/ProcessMcpResult"
    ProcessResponse:
      allOf:
        - $ref: "#/components/schemas/ProcessResponseBase"
      unevaluatedProperties: false
    ProcessReadResponse:
      description: 紧凑 ProcessResponse 与独立的可选事件面板；事件面板不计入 ProcessResponse 的响应预算。
      allOf:
        - $ref: "#/components/schemas/ProcessResponseBase"
        - type: object
          properties:
            events:
              $ref: "#/components/schemas/EventPanel"
      unevaluatedProperties: false
    ProcessCancelResponse:
      type: object
      description: Agent 的类型化取消结果及独立的可选事件面板。
      required: [processId, state, cancelOutcome, terminationEvidence]
      additionalProperties: false
      properties:
        processId:
          type: string
        state:
          $ref: "#/components/schemas/ProcessState"
        cancelOutcome:
          type: string
        terminationEvidence:
          type: string
        error:
          $ref: "#/components/schemas/ProcessError"
        events:
          $ref: "#/components/schemas/EventPanel"
    ProcessExecResponse:
      allOf:
        - $ref: "#/components/schemas/ProcessResponseBase"
        - type: object
          properties:
            events:
              $ref: "#/components/schemas/EventPanel"
      unevaluatedProperties: false
    ProcessBatchResponse:
      type: object
      description: 按输入顺序返回的子进程紧凑观察；整个批次共享一个响应字节预算。
      required: [batchId, status, processes]
      additionalProperties: false
      properties:
        batchId:
          type: string
        status:
          type: string
          description: 批次聚合状态。
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessResponse"
        events:
          $ref: "#/components/schemas/EventPanel"
    McpBatchStatus:
      type: string
      enum: [running, completed, completed_with_errors, rejected]
    McpBatchToolChildResponse:
      description: 按输入顺序返回的子项索引、可选调用 id 与紧凑 ProcessResponse。
      allOf:
        - $ref: "#/components/schemas/ProcessResponseBase"
        - type: object
          required: [index]
          properties:
            index:
              type: integer
              minimum: 0
            id:
              type: string
      unevaluatedProperties: false
    McpBatchToolResponse:
      type: object
      required: [batchId, status, results]
      additionalProperties: false
      properties:
        batchId:
          type: string
        status:
          $ref: "#/components/schemas/McpBatchStatus"
        error:
          $ref: "#/components/schemas/ProcessError"
        results:
          type: array
          minItems: 1
          maxItems: 16
          description: Flat compact child ProcessResponse objects in original input order.
          items:
            $ref: "#/components/schemas/McpBatchToolChildResponse"
        events:
          $ref: "#/components/schemas/EventPanel"
