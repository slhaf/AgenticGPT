        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AgentId:
      name: agentId
      in: query
      required: true
      description: Target enabled local Agentic agent id.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with an existing Room skill or idempotency key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid or missing GPT Actions API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Agent or session was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GatewayTimeout:
      description: Hub timed out waiting for the local agent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Hub could not deliver the proxied request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Hub internal error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    TmuxSession:
      type: object
      required:
        - session
        - windows
        - attached
        - createdEpoch
        - activityEpoch
      additionalProperties: false
      properties:
        session:
          type: string
        windows:
          type:
            - integer
            - "null"
        attached:
          type: boolean
        createdEpoch:
          type:
            - integer
            - "null"
        activityEpoch:
          type:
            - integer
            - "null"
    TmuxPane:
      type: object
      required:
        - session
        - windowIndex
        - paneIndex
        - paneId
        - currentPath
        - currentCommand
        - width
        - height
        - panePid
        - paneInMode
        - paneDead
        - isLikelyShell
      additionalProperties: false
      properties:
        session:
          type: string
        windowIndex:
          type:
            - integer
            - "null"
        paneIndex:
          type:
            - integer
            - "null"
        paneId:
          type: string
        currentPath:
          type: string
        currentCommand:
          type: string
        width:
          type:
            - integer
            - "null"
        height:
          type:
            - integer
            - "null"
        panePid:
          type:
            - integer
            - "null"
        paneInMode:
          type: boolean
        paneDead:
          type: boolean
        isLikelyShell:
          type: boolean
    TmuxListSessionsResponse:
      type: object
      required:
        - sessions
      additionalProperties: true
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/TmuxSession"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    TmuxListPanesResponse:
      type: object
      required:
        - panes
      additionalProperties: true
      properties:
        session:
          type:
            - string
            - "null"
        panes:
          type: array
          items:
            $ref: "#/components/schemas/TmuxPane"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    TmuxCaptureRequest:
      type: object
      required:
        - agentId
        - target
      additionalProperties: false
      properties:
        agentId:
          type: string
        target:
          type: string
        lines:
          type: integer
          minimum: 1
          maximum: 5000
          default: 160
    TmuxCaptureResponse:
      type: object
      additionalProperties: true
      properties:
        target:
          type: string
        lines:
          type: integer
        capture:
          type: string
        error:
          $ref: "#/components/schemas/ErrorDetail"
    TmuxExecRequest:
      type: object
      required:
        - agentId
        - target
        - program
      additionalProperties: false
      properties:
        agentId:
          type: string
        target:
          type: string
        program:
          type: string
        args:
          type: array
          default: []
          items:
            type: string
        needConfirm:
          type: boolean
          default: false
          description: Force confirmation in addition to configured command policy.
        waitMs:
          type: integer
          minimum: 0
          maximum: 5000
          default: 300
          description: Milliseconds to wait before returning the post-submit pane snapshot.
        captureLines:
          type: integer
          minimum: 0
          maximum: 5000
          default: 120
          description: Number of tmux history lines included in the post-submit snapshot. Set to 0 to disable the snapshot.
    TmuxPasteRequest:
      type: object
      required:
        - agentId
        - target
        - text
      additionalProperties: false
      properties:
        agentId:
          type: string
        target:
          type: string
        text:
          type: string
        submit:
          type: boolean
          default: false
        needConfirm:
          type: boolean
          default: true
    TmuxCreateSessionRequest:
      type: object
      required:
        - agentId
        - name
        - cwd
      additionalProperties: false
      properties:
        agentId:
          type: string
        name:
          type: string
        cwd:
          type: string
          description: Existing session cwd. It must be inside writable roots and outside denied roots.
    TmuxCloseSessionRequest:
      type: object
      required:
        - agentId
        - name
      additionalProperties: false
      properties:
        agentId:
          type: string
        name:
          type: string
        needConfirm:
          type: boolean
          default: true
    TmuxOperationResponse:
      type: object
      additionalProperties: true
      properties:
        accepted:
          type: boolean
        waitMs:
          type: integer
        captureLines:
          type: integer
        snapshot:
          type: object
          additionalProperties: true
          properties:
            target:
              type: string
            waitMs:
              type: integer
            lines:
              type: integer
            capture:
              type: string
            error:
              $ref: "#/components/schemas/ErrorDetail"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
    HubInfoResponse:
      type: object
      required:
        - service
        - version
        - publicBaseUrl
        - requestTimeoutSeconds
        - maxWaitSeconds
        - remoteConfirmation
        - agents
        - counts
        - generatedAt
      additionalProperties: false
      properties:
        service:
          type: string
        version:
          type: string
        publicBaseUrl:
          type:
            - string
            - "null"
        requestTimeoutSeconds:
          type: integer
        maxWaitSeconds:
          type: integer
        remoteConfirmation:
          type: object
          required:
            - enabled
            - provider
            - timeoutSeconds
            - ntfyConfigured
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            provider:
              type: string
            timeoutSeconds:
              type: integer
            ntfyConfigured:
              type: boolean
        agents:
          type: object
          required:
            - registeredCount
            - enabledCount
            - onlineCount
          additionalProperties: false
          properties:
            registeredCount:
              type: integer
            enabledCount:
              type: integer
            onlineCount:
              type: integer
        counts:
          type: object
          required:
            - pendingRequestCount
            - pendingConfirmationCount
            - cachedProcessCount
          additionalProperties: false
          properties:
            pendingRequestCount:
              type: integer
            pendingConfirmationCount:
              type: integer
            cachedProcessCount:
              type: integer
        generatedAt:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
            - code
            - message
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
    AgentRun:
      type: object
      required:
        - runId
        - requestId
        - agentId
        - commandType
        - commandHash
        - status
        - resultRetained
        - resultOmitted
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        runId:
          type: string
        requestId:
          type: string
        agentId:
          type: string
        commandType:
          type: string
        commandHash:
          type: string
        source:
          type: string
        profile:
          type: string
        detail:
          type: string
        arguments:
          description: Agent-reported argument details when retained.
        processId:
          type: string
        process:
          $ref: "#/components/schemas/ProcessInfo"
        status:
          type: string
          enum:
            - created
            - dispatched
            - acked
            - started
            - running
            - completed
            - timeout_waiting_result
            - unknown
            - failed
        result:
          description: Completed command result when the authoritative payload is retained; omitted after eligible retention compaction.
        resultRetained:
          type: boolean
          description: True when the authoritative result payload is retained in Hub storage.
        resultOmitted:
          type: boolean
          description: True when an eligible completed payload was compacted while its run identity and result hash remain retained.
        reason:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ListAgentsResponse:
      type: object
      required:
        - agents
      additionalProperties: false
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummary"
    AgentSummary:
      type: object
      required:
        - agentId
        - displayName
        - online
        - transport
        - lastSeenAt
        - capabilities
        - configSummary
      additionalProperties: false
      properties:
