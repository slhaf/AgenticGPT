# Historical/noncanonical artifact retained for reference. The supported current
# OpenAPI import is openapi/hub.yaml. This file is not a CI/runtime gate; external
# consumers have not been enumerated.
openapi: 3.1.0
info:
  title: Agentic GPT Minimal Agents API (historical, noncanonical)
  description: >-
    Historical minimal artifact retained for reference only. Readers and
    importers should use openapi/hub.yaml for the supported current contract.
    This artifact is not a CI or runtime gate, and no claim is made about
    external consumers.
  version: 0.1.0
servers:
  - url: https://agentic-gpt.example.com
paths:
  /v1/agents:
    get:
      operationId: listAgents
      x-openai-isConsequential: false
      summary: List enabled local agents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enabled agents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                required:
                  - agents
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                required:
                  - error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas: {}
