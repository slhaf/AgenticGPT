openapi: 3.1.0
info:
  title: Agentic GPT Minimal Agents API
  version: 0.1.0
servers:
  - url: https://agentic-gpt.example.com
paths:
  /v1/agents:
    get:
      operationId: listAgents
      x-openai-isConsequential: false
      summary: List enabled local agents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enabled agents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                required:
                  - agents
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                required:
                  - error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas: {}
