name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install repository Rust toolchain
        # rustup reads rust-toolchain.toml and installs its version/components.
        run: |
          rustup show
          rustc --version --verbose
          cargo --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Build runtime binaries for contract parity
        run: cargo build -p agentic-gpt -p agentic-gpt-hub

      - name: Install contract parity dependencies
        run: python3 -m pip install "PyYAML" "jsonschema[format]>=4.25,<5"

      - name: Run live contract parity gate
        run: python3 scripts/check_contract_parity.py
