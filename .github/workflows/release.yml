name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run release preflight
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release-preflight.sh

  linux:
    name: Build Linux release artifacts
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Linux binaries
        run: scripts/dist-linux.sh

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for target_dir in dist/*; do
            target="$(basename "$target_dir")"
            tar -C "$target_dir" -czf "release/agentic-gpt-${target}.tar.gz" agentic-gpt agentic-gpt-hub agentic-browser-host
          done
          sha256sum release/*.tar.gz > release/SHA256SUMS
          ls -lh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS
