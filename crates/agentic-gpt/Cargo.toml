[package]
name = "agentic-gpt"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "agentic-gpt"
path = "src/main.rs"

[dependencies]
agentic-gpt-protocol.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
dirs = "6.0"
futures-util.workspace = true
notify-rust = "4.11"
rmcp = { version = "1.7.0", default-features = false, features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
uuid.workspace = true
