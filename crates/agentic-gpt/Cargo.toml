[package]
name = "agentic-gpt"
version = "0.11.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "agentic-gpt"
path = "src/main.rs"

[dependencies]
hmac = "0.12"
agentic-apply-patch = { path = "../agentic-apply-patch" }
agentic-gpt-protocol = { workspace = true, features = ["schema"] }
anyhow.workspace = true
axum = "0.7"
base64 = "0.22"
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
dirs = "6.0"
futures-util.workspace = true
globset = "=0.4.19"
gif = "=0.13.1"
ratatui.workspace = true
crossterm.workspace = true
ignore = "=0.4.31"
image = { version = "=0.25.8", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
imap = { version = "=3.0.0-alpha.15", default-features = false }
imap-proto = "0.16.1"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
mailparse = "=0.18.0"
htmd = "=0.5.6"
libc = "0.2"
obscura-browser = { path = "../../vendor/obscura/crates/obscura-browser", features = ["render"] }
obscura-js = { path = "../../vendor/obscura/crates/obscura-js", features = ["render"] }
notify-rust = "4.11"
zbus = "5.15"
parking_lot = "0.12"
rmcp = { version = "=3.10.0", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "transport-child-process"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
regex = "=1.13.1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
sha2 = "0.10"
similar = "=3.1.1"
tokio.workspace = true
tokio-util = "0.7"
url = "2"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tempfile = "3"
urlencoding = "2.1"
unicode-width.workspace = true
uuid.workspace = true
webpki-roots = "1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }
