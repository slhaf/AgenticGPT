[package]
name = "agentic-gpt"
version = "0.9.1"
edition.workspace = true
license.workspace = true

[[bin]]
name = "agentic-gpt"
path = "src/main.rs"

[dependencies]
agentic-gpt-protocol.workspace = true
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
dirs = "6.0"
futures-util.workspace = true
globset = "=0.4.19"
inquire.workspace = true
ratatui.workspace = true
crossterm.workspace = true
ignore = "=0.4.31"
libc = "0.2"
notify-rust = "4.11"
rmcp = { version = "1.7.0", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
regex = "=1.13.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = "0.10"
similar = "=3.1.1"
tokio.workspace = true
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
urlencoding = "2.1"
uuid.workspace = true
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
